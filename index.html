<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九科图谱 · 高中错题知识库（校内试用分享版）</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#f4f3ee; --surface:#fff; --surface-2:#faf9f5; --surface-3:#f1f0ea;
  --ink:#1c2330; --ink-2:#3d4557; --muted:#7c8294; --faint:#a4a9b7;
  --line:#e8e6df; --line-strong:#dad7cc;
  --brand:#17694f; --brand-2:#0e8a65; --brand-soft:#e7f3ed; --brand-tint:#f1f8f4;
  --amber:#b8761c; --amber-soft:#fbf1df;
  --danger:#b94a48; --danger-soft:#fbeeed;
  --radius:18px; --radius-sm:12px;
  --shadow:0 1px 2px rgba(28,35,48,.04),0 10px 30px rgba(28,35,48,.055);
  --shadow-lift:0 2px 4px rgba(28,35,48,.04),0 18px 48px rgba(28,35,48,.12);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","Noto Serif SC",STSong,"SimSun",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;
  background:
    radial-gradient(1100px 560px at 6% -8%, #eaf4ef 0%, transparent 58%),
    radial-gradient(900px 500px at 102% -4%, #f8efe0 0%, transparent 52%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
a{color:inherit;text-decoration:none}
::selection{background:#cfe9dd}
svg{display:block}
.icon{width:18px;height:18px;flex:none}

/* scrollbars */
.col::-webkit-scrollbar,.modal-body::-webkit-scrollbar,.drawer-body::-webkit-scrollbar{width:8px;height:8px}
.col::-webkit-scrollbar-thumb,.modal-body::-webkit-scrollbar-thumb,.drawer-body::-webkit-scrollbar-thumb{background:#d9d6cc;border-radius:8px;border:2px solid transparent;background-clip:content-box}
.col::-webkit-scrollbar-track{background:transparent}

/* ---------- header ---------- */
.topbar{
  position:sticky;top:0;z-index:40;height:64px;display:flex;align-items:center;gap:24px;
  padding:0 24px;background:rgba(250,249,245,.82);backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(218,215,204,.75);
}
.brand{display:flex;align-items:center;gap:11px;min-width:228px}
.brandmark{
  width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#175f49,#0d8a66);
  display:grid;place-items:center;box-shadow:0 6px 16px rgba(23,105,79,.24);position:relative;overflow:hidden;
}
.brandmark::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 30% 15%,rgba(255,255,255,.35),transparent)}
.brandmark svg{position:relative;z-index:1}
.brand-txt b{display:block;font-size:16px;letter-spacing:.02em;font-weight:700;line-height:1.2}
.brand-txt span{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;margin-top:2px}
.nav{display:flex;align-items:center;gap:4px;background:#ecebe4;border:1px solid #e3e1d7;border-radius:12px;padding:4px}
.nav button{
  display:flex;align-items:center;gap:7px;padding:7px 15px;border-radius:9px;font-size:13px;color:#5d6473;
  transition:.18s ease;white-space:nowrap;
}
.nav button:hover{color:var(--ink)}
.nav button.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(28,35,48,.07),0 4px 12px rgba(28,35,48,.06)}
.nav .dot-live{width:6px;height:6px;border-radius:50%;background:var(--brand-2);box-shadow:0 0 0 3px #dff1e9}
.nav button .nav-ic{width:15px;height:15px;flex:none;opacity:.8}
.nav button.active .nav-ic{opacity:1}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#646b7a;transition:.18s}
.icon-btn:hover{background:#efeee7;color:var(--ink)}
.avatar-wrap{display:flex;align-items:center;gap:9px;padding:4px 6px 4px 4px;border-radius:12px}
.avatar-wrap:hover{background:#efeee7}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,#d9b48b,#a9794f);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;letter-spacing:.02em;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.avatar-meta b{display:block;font-size:12px;font-weight:600;line-height:1.3}
.avatar-meta span{display:block;font-size:10.5px;color:var(--muted)}

/* ---------- layout ---------- */
.app{
  display:grid;grid-template-columns:234px minmax(0,1fr) 366px;gap:16px;
  max-width:1680px;margin:0 auto;padding:16px 20px 24px;height:calc(100vh - 64px);min-height:660px;
}
.col{min-height:0;overflow-y:auto;overscroll-behavior:contain}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{padding:17px 18px 0}
.card-head h2{font-size:14px;font-weight:650;letter-spacing:.01em}
.card-head p{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---------- left nav ---------- */
.left{display:flex;flex-direction:column;gap:12px;overflow:hidden}
.left-card{display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden}
.left-head{padding:17px 16px 12px;display:flex;align-items:center;justify-content:space-between}
.left-head h2{font-size:13px;font-weight:650;letter-spacing:.02em}
.left-head span{font-size:10.5px;color:var(--faint);letter-spacing:.04em}
.subj-list{padding:0 8px 8px;overflow-y:auto;flex:1;min-height:0}
.subj-list::-webkit-scrollbar{width:6px}
.subj-list::-webkit-scrollbar-thumb{background:#ddd9ce;border-radius:6px}
.subj-item{
  width:100%;display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:10px;
  transition:.16s;text-align:left;position:relative;color:#444c5d;
}
.subj-item:hover{background:var(--surface-2)}
.subj-item.active{background:var(--brand-tint);color:var(--ink);font-weight:600}
.subj-item.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2.5px;border-radius:2px;background:var(--brand-2)}
.subj-glyph{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 11%,#fff);flex:none;letter-spacing:.02em}
.subj-name{flex:1;min-width:0}
.subj-count{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;background:#f3f2ec;padding:1px 7px;border-radius:20px}
.subj-item.active .subj-count{background:#fff;color:var(--brand)}
.all-item{margin-bottom:4px;border-bottom:1px dashed var(--line);border-radius:10px 10px 0 0;padding-bottom:10px}
.all-item .subj-glyph{background:#eff1ee;color:#4f5b55}

.chapter-panel{border-top:1px solid var(--line);padding:14px 12px 12px;overflow-y:auto;max-height:43%;min-height:140px}
.chapter-panel::-webkit-scrollbar{width:6px}
.chapter-panel::-webkit-scrollbar-thumb{background:#ddd9ce;border-radius:6px}
.chapter-title{display:flex;align-items:center;justify-content:space-between;padding:0 5px 8px;font-size:10.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.chapter-title b{font-weight:600;color:var(--muted);font-size:10.5px;letter-spacing:.02em;text-transform:none}
.chapter-item{width:100%;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:12.5px;color:#565d6c;text-align:left;transition:.15s}
.chapter-item:hover{background:var(--surface-2);color:var(--ink)}
.chapter-item.active{background:#f2f6f3;color:var(--brand);font-weight:600}
.chapter-item i{width:4px;height:4px;border-radius:50%;background:#c9c7bd;flex:none}
.chapter-item.active i{background:var(--brand-2)}
.chapter-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chapter-item em{font-style:normal;font-size:10.5px;color:var(--faint)}
.chapter-book{display:flex;align-items:center;justify-content:space-between;margin:10px 6px 4px;padding-top:8px;border-top:1px dashed #ece9de;font-size:10px;color:#a4a89a;letter-spacing:.03em}
.chapter-book:first-of-type{border-top:0;margin-top:4px}
.chapter-book em{font-style:normal;font-size:9.5px;color:#b7baae}
.chapter-empty{padding:10px 8px;font-size:11.5px;color:var(--faint);line-height:1.7}
.left-foot{padding:10px 14px 12px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.left-foot button{font-size:10.5px;color:var(--faint);display:flex;align-items:center;gap:4px}
.left-foot button:hover{color:var(--danger)}
.left-foot span{font-size:10px;color:#c1c0b7}

/* ---------- center ---------- */
.center{display:flex;flex-direction:column;gap:14px;padding-right:2px}
.hero{
  position:relative;border-radius:22px;overflow:hidden;padding:24px 26px;flex:none;
  background:linear-gradient(125deg,#fffefb 0%,#f6f3e9 55%,#edf4ef 100%);
  border:1px solid #e7e3d7;box-shadow:var(--shadow);
}
.hero::before{content:"";position:absolute;right:-60px;top:-110px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(23,105,79,.12),transparent 66%)}
.hero::after{content:"";position:absolute;right:140px;bottom:-90px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(23,105,79,.12)}
.hero-inner{position:relative;display:flex;align-items:center;gap:20px}
.hero-copy{flex:1;min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--brand);letter-spacing:.14em;font-weight:600;margin-bottom:8px}
.eyebrow::before{content:"";width:16px;height:1px;background:var(--brand-2)}
.hero h1{font-family:var(--serif);font-size:29px;line-height:1.24;letter-spacing:.01em;font-weight:600;color:#18251f}
.hero h1 em{font-style:normal;color:var(--brand);position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:1px;height:6px;background:rgba(23,105,79,.12);border-radius:4px;z-index:-1}
.hero p{font-size:12.5px;color:#737a70;margin-top:8px;max-width:430px;line-height:1.7}
.hero-stats{display:flex;gap:0;flex:none;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:12px 4px;box-shadow:0 8px 24px rgba(40,60,48,.06);backdrop-filter:blur(4px)}
.hero-stat{padding:2px 18px;text-align:center;min-width:82px}
.hero-stat + .hero-stat{border-left:1px solid #e6e3d8}
.hero-stat b{display:block;font-size:22px;line-height:1.15;font-family:var(--serif);font-weight:600;color:#22352b;font-variant-numeric:tabular-nums}
.hero-stat b small{font-size:11px;font-family:var(--sans);font-weight:500;color:var(--muted);margin-left:2px}
.hero-stat span{display:block;font-size:10.5px;color:#8b9185;margin-top:3px;letter-spacing:.02em}
.hero-actions{display:flex;gap:8px;margin-top:14px}
.hero-actions button{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:6px 11px;border-radius:8px;border:1px solid #dedbd0;background:rgba(255,255,255,.7);color:#596158}
.hero-actions button:hover{background:#fff;color:var(--brand);border-color:#c9d9d0}

.toolbar{display:flex;align-items:center;gap:10px;flex:none;flex-wrap:wrap}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px;height:40px;box-shadow:0 1px 2px rgba(28,35,48,.03);transition:.18s}
.search:focus-within{border-color:#b9d3c7;box-shadow:0 0 0 4px rgba(23,105,79,.07)}
.search svg{color:#9b9f8f}
.search input{flex:1;border:0;outline:0;background:none;font-size:13px;min-width:0}
.search input::placeholder{color:#adafa4}
.search kbd{font-family:var(--sans);font-size:10px;color:#a7aa9e;border:1px solid #e2e0d6;background:#faf9f4;border-radius:5px;padding:1px 5px}
.chips{display:flex;gap:5px;background:#ecebe4;border:1px solid #e3e1d7;border-radius:11px;padding:3px}
.chips button{font-size:11.5px;padding:5px 10px;border-radius:8px;color:#6c726a;white-space:nowrap;transition:.15s}
.chips button:hover{color:var(--ink)}
.chips button.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(28,35,48,.08)}
.ghost-btn{height:40px;display:flex;align-items:center;gap:6px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:12px;color:#666d78;transition:.16s;white-space:nowrap}
.ghost-btn:hover{border-color:#cfdbd5;color:var(--brand);background:var(--brand-tint)}

.section-head{display:flex;align-items:flex-end;justify-content:space-between;padding:2px 2px 0;flex:none}
.section-head h2{font-size:14px;font-weight:650;letter-spacing:.01em}
.section-head h2 span{font-size:11px;color:var(--faint);font-weight:400;margin-left:6px}
.section-head .crumb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--faint)}
.section-head .crumb button{color:var(--muted)}
.section-head .crumb button:hover{color:var(--brand)}
.section-head .crumb i{font-style:normal;color:#ccc9bd}

/* subject grid */
.subject-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:none}
.subject-card{
  --c:#4C6FE0;position:relative;text-align:left;background:#fff;border:1px solid var(--line);border-radius:15px;
  padding:14px 14px 12px;transition:.18s;overflow:hidden;box-shadow:0 1px 2px rgba(28,35,48,.02);
}
.subject-card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2.5px;border-radius:0 3px 3px 0;background:var(--c);opacity:.85}
.subject-card:hover{transform:translateY(-2px);border-color:#ddd9cc;box-shadow:0 10px 26px rgba(28,35,48,.08)}
.sc-top{display:flex;align-items:center;gap:8px}
.sc-dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.sc-name{font-size:13.5px;font-weight:650;letter-spacing:.02em}
.sc-count{margin-left:auto;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.sc-points{font-size:11px;color:#8a8f84;margin-top:7px;height:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-bar{height:4px;background:#efede5;border-radius:4px;margin-top:9px;overflow:hidden}
.sc-bar i{display:block;height:100%;border-radius:4px;background:var(--c);opacity:.75}
.sc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:10px;color:var(--faint)}
.sc-foot b{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

/* chapter / points */
.kb-body{display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.chapter-block{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(28,35,48,.02);overflow:hidden}
.chapter-block > header{display:flex;align-items:center;gap:10px;padding:13px 16px;background:linear-gradient(180deg,#fdfcf8,#fbfaf5);border-bottom:1px solid #efede5}
.chapter-block > header h3{font-size:12.5px;font-weight:650;letter-spacing:.01em}
.chapter-block > header span{font-size:10.5px;color:var(--faint);margin-left:auto;font-variant-numeric:tabular-nums}
.chapter-block > header .ch-dot{width:6px;height:6px;border-radius:50%;background:var(--c,#96a19a);box-shadow:0 0 0 3px color-mix(in srgb,var(--c,#96a19a) 12%,#fff)}
.point-row{display:flex;align-items:center;gap:13px;padding:13px 16px;border-bottom:1px solid #f2f0e9;width:100%;text-align:left;transition:.14s;position:relative}
.point-row:last-child{border-bottom:0}
.point-row:hover{background:#fcfbf7}
.point-row:hover .pr-arrow{opacity:1;transform:translateX(0)}
.pr-main{flex:1;min-width:0}
.pr-title{display:flex;align-items:center;gap:8px}
.pr-title b{font-size:12.5px;font-weight:600;letter-spacing:.01em}
.pr-title .tag{font-size:9.5px;padding:1px 6px;border-radius:20px;background:#f4f2ea;color:#92978b;font-weight:500}
.pr-meta{font-size:10.5px;color:var(--faint);margin-top:4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pr-meta i{width:2px;height:2px;border-radius:50%;background:#ccc9bd;font-style:normal}
.pr-meta .reason{color:#a08254}
.pr-meter{width:78px;flex:none}
.pr-meter .mbar{height:4px;border-radius:4px;background:#efede5;overflow:hidden;display:flex;gap:2px}
.pr-meter .mbar i{display:block;flex:1;background:#e3e0d6;border-radius:3px;transition:.2s}
.pr-meter .mbar i.on{background:var(--c,#17694f);opacity:.8}
.pr-meter span{display:block;font-size:9.5px;color:var(--faint);margin-top:4px;text-align:right;letter-spacing:.02em}
.pr-count{flex:none;min-width:38px;text-align:right;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.pr-count b{display:block;font-size:14px;color:#4e5666;font-weight:600;line-height:1.1}
.pr-arrow{flex:none;color:#b6b9ad;opacity:.35;transform:translateX(-3px);transition:.16s}

/* search results */
.result-list{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.result-card{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:13px 15px;background:#fff;border:1px solid var(--line);border-radius:13px;transition:.15s;width:100%}
.result-card:hover{border-color:#d5d2c4;box-shadow:0 6px 18px rgba(28,35,48,.05)}
.rc-main{flex:1;min-width:0}
.rc-title{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rc-title .subj-badge{font-size:9.5px;font-weight:600;padding:1px 7px;border-radius:20px;background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--c)}
.rc-ex{font-size:11.5px;color:#858a7f;margin-top:4px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.55}
.rc-meta{font-size:10px;color:var(--faint);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.rc-date{font-size:10px;color:#b3b5a9;flex:none;padding-top:2px}
mark{background:#f9e9b8;color:inherit;border-radius:2px;padding:0 1px}
.empty{text-align:center;padding:48px 20px;color:var(--faint);background:#fff;border:1px dashed #dcd9cc;border-radius:16px}
.empty .e-ic{width:46px;height:46px;border-radius:14px;background:#f4f2ea;display:grid;place-items:center;margin:0 auto 12px;color:#b3b5a8}
.empty b{display:block;font-size:13px;color:#70766b;font-weight:600}
.empty p{font-size:11.5px;margin-top:4px}
.empty button{margin-top:12px;font-size:11.5px;color:var(--brand);border-bottom:1px solid #bcd6c9;padding-bottom:1px}

/* ---------- graph ---------- */
.graph-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);flex:none}
.graph-head{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px 0;position:relative;z-index:2}
.graph-head h2{font-size:14px;font-weight:650}
.graph-head p{font-size:11px;color:var(--muted);margin-top:3px}
.graph-legend{display:flex;align-items:center;gap:14px;font-size:10px;color:var(--faint)}
.graph-legend span{display:flex;align-items:center;gap:5px}
.graph-legend i{width:6px;height:6px;border-radius:50%;background:#9fb5aa}
.graph-legend i.big{width:10px;height:10px}
#graphWrap{position:relative;margin-top:-4px}
#graphSvg{width:100%;height:auto;display:block}
.gnode{cursor:pointer}
.gnode .halo{opacity:0;transition:.2s}
.gnode:hover .halo{opacity:1}
.gnode text{user-select:none;pointer-events:none}
.graph-hint{position:absolute;left:20px;bottom:12px;font-size:10px;color:#b0b3a6;display:flex;align-items:center;gap:6px}
.graph-hint svg{width:12px;height:12px}
.graph-side{position:absolute;right:18px;bottom:14px;display:flex;gap:6px}
.graph-side button{font-size:10px;padding:4px 9px;border-radius:7px;border:1px solid #e6e3d7;background:#fbfaf5;color:#7d8376}
.graph-side button:hover{background:#fff;color:var(--brand)}

/* review view */
.review-hero{display:flex;align-items:center;gap:22px;background:linear-gradient(135deg,#fffef9,#f3f8f4);border:1px solid #e4e7dc;border-radius:18px;padding:20px 22px;flex:none;box-shadow:var(--shadow)}
.ring-wrap{position:relative;width:92px;height:92px;flex:none}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-wrap .ring-txt{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-wrap b{font-size:21px;font-family:var(--serif);font-weight:600;line-height:1;color:#25372f}
.ring-wrap span{font-size:9px;color:var(--faint);margin-top:2px}
.review-copy{flex:1}
.review-copy h2{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.01em}
.review-copy p{font-size:11.5px;color:#7f857a;margin-top:5px;line-height:1.65}
.review-copy .rv-nums{display:flex;gap:18px;margin-top:10px;font-size:10.5px;color:var(--muted)}
.review-copy .rv-nums b{font-weight:650;color:#3e4a42;font-size:12px;margin-right:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;font-size:12.5px;font-weight:550;transition:.16s;white-space:nowrap}
.btn.primary{background:linear-gradient(180deg,#1a7557,#116147);color:#fff;box-shadow:0 5px 14px rgba(23,105,79,.22);padding:10px 16px}
.btn.primary:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 8px 20px rgba(23,105,79,.26)}
.btn.primary:active{transform:none}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.soft{background:#f5f3eb;border:1px solid #e6e3d7;color:#5d6459;padding:9px 13px}
.btn.soft:hover{background:#fff;color:var(--brand);border-color:#cfdcd3}
.btn.block{width:100%}
.btn.sm{font-size:11px;padding:6px 10px;border-radius:8px}

.due-list{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.due-row{display:flex;align-items:center;gap:12px;padding:13px 15px;background:#fff;border:1px solid var(--line);border-radius:13px;text-align:left;transition:.15s}
.due-row:hover{border-color:#d4d1c3;background:#fdfcf8}
.due-dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.due-main{flex:1;min-width:0}
.due-main b{font-size:12.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due-main span{font-size:10.5px;color:var(--faint);display:block;margin-top:2px}
.due-badge{font-size:9.5px;color:#9b7c47;background:#faf2e1;border:1px solid #f2e5c8;padding:2px 8px;border-radius:20px;flex:none}
.due-badge.over{color:var(--danger);background:var(--danger-soft);border-color:#f4d9d7}

/* ---------- right rail ---------- */
.right{display:flex;flex-direction:column;gap:12px;padding-bottom:4px;overflow-anchor:none}
.right>*{flex:none}
.upload-card{padding:17px 17px 15px;position:relative;overflow:hidden}
.upload-card::after{content:"";position:absolute;right:-40px;top:-50px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(23,105,79,.07),transparent 70%);pointer-events:none}
.upload-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;position:relative}
.upload-head h2{font-size:15px;font-weight:650;letter-spacing:.01em}
.upload-head p{font-size:11px;color:var(--muted);margin-top:3px}
.ai-badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:600;color:var(--brand);background:var(--brand-soft);border:1px solid #d2e8dd;border-radius:20px;padding:3px 8px;flex:none;letter-spacing:.02em}
.ai-badge .spark{width:10px;height:10px}
.dropzone{
  margin-top:14px;border:1.5px dashed #d7d4c6;border-radius:14px;background:linear-gradient(180deg,#fdfcf8,#faf9f3);
  padding:19px 12px 17px;text-align:center;cursor:pointer;transition:.18s;position:relative;
}
.dropzone:hover,.dropzone.drag{border-color:#8dbbaa;background:var(--brand-tint);box-shadow:inset 0 0 0 3px rgba(23,105,79,.04)}
.dropzone .dz-ic{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid #e7e4d9;display:grid;place-items:center;margin:0 auto 9px;color:var(--brand);box-shadow:0 4px 12px rgba(28,35,48,.05)}
.dropzone b{display:block;font-size:12px;font-weight:600;color:#3e4640}
.dropzone span{display:block;font-size:10px;color:#a0a498;margin-top:3px}
.dropzone .dz-formats{display:flex;justify-content:center;gap:4px;margin-top:8px}
.dropzone .dz-formats em{font-style:normal;font-size:8.5px;letter-spacing:.03em;color:#9da194;background:#fff;border:1px solid #e9e6da;border-radius:4px;padding:1px 4px}
.upload-actions{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.btn-upload{
  width:100%;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg,#1a7557,#106147);color:#fff;font-size:13px;font-weight:600;letter-spacing:.01em;
  box-shadow:0 6px 16px rgba(23,105,79,.22);transition:.16s;
}
.btn-upload:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 9px 22px rgba(23,105,79,.27)}
.btn-upload:active{transform:none}
.mini-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mini-btn{height:34px;border-radius:9px;border:1px solid #e6e3d7;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:#6a7167;transition:.15s}
.mini-btn:hover{border-color:#c9dcd2;color:var(--brand);background:var(--brand-tint)}
.upload-tip{display:flex;align-items:flex-start;gap:6px;font-size:9.5px;color:#9a9f92;line-height:1.55;margin-top:9px}
.fab-upload{display:none}
.upload-tip svg{width:12px;height:12px;margin-top:1px;flex:none;color:#b09a6e}

.side-card{padding:15px 16px}
.side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.side-head h3{font-size:12.5px;font-weight:650;display:flex;align-items:center;gap:6px}
.side-head h3 .count{font-size:9.5px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:20px;padding:1px 6px}
.side-head button{font-size:10px;color:var(--faint)}
.side-head button:hover{color:var(--brand)}
.review-mini{display:flex;align-items:center;gap:12px;margin:2px 0 10px}
.mini-ring{width:52px;height:52px;position:relative;flex:none}
.mini-ring svg{transform:rotate(-90deg)}
.mini-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-family:var(--serif);font-weight:600;color:#33443a}
.mini-review-copy{flex:1}
.mini-review-copy b{font-size:12px;display:block;line-height:1.3}
.mini-review-copy span{font-size:10px;color:var(--faint);display:block;margin-top:2px}
.side-btn{width:100%;height:32px;border-radius:8px;background:#f5f3eb;border:1px solid #e7e4d8;font-size:11px;color:#5d6459;display:flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
.side-btn:hover{background:#fff;border-color:#c9dcd2;color:var(--brand)}
.recent-list{display:flex;flex-direction:column;gap:1px}
.recent-row{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px dashed #f0eee6}
.recent-row:last-child{border-bottom:0}
.recent-check{width:20px;height:20px;border-radius:6px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand-2);flex:none}
.recent-check svg{width:11px;height:11px}
.recent-main{flex:1;min-width:0}
.recent-main b{display:block;font-size:10.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-main span{display:block;font-size:9px;color:#b2b5a8;margin-top:1px}
.recent-time{font-size:8.5px;color:#bbbdb0;flex:none}
.week-bars{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:6px}
.week-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.week-bar i{width:100%;border-radius:3px 3px 1px 1px;background:#dcebe4;transition:.2s}
.week-bar.today i{background:var(--brand-2)}
.week-bar span{font-size:8px;color:#b4b7aa}
.week-foot{display:flex;justify-content:space-between;font-size:9px;color:#b0b3a6;margin-top:7px}

/* ---------- modal base ---------- */
.overlay{
  position:fixed;inset:0;z-index:80;background:rgba(24,30,26,.34);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:.22s;
}
.overlay.open{opacity:1;pointer-events:auto}
.modal{
  width:min(780px,100%);max-height:calc(100vh - 48px);background:#fcfbf7;border-radius:20px;
  box-shadow:0 30px 80px rgba(15,25,20,.3);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(10px) scale(.99);transition:.22s;
}
.overlay.open .modal{transform:none}
.modal-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 14px;border-bottom:1px solid #eae7dd;background:#fff}
.modal-head h2{font-size:17px;font-family:var(--serif);font-weight:600;letter-spacing:.01em}
.modal-head p{font-size:11px;color:var(--muted);margin-top:2px}
.modal-head .close{margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#969b8f}
.modal-head .close:hover{background:#f3f1e9;color:var(--ink)}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1}
.modal-foot{display:flex;align-items:center;gap:9px;padding:13px 22px;border-top:1px solid #eae7dd;background:#fff}
.modal-foot .left-note{font-size:10px;color:#a4a899;margin-right:auto;display:flex;align-items:center;gap:5px}
.modal-foot .left-note svg{width:12px;height:12px}

/* steps */
.steps{display:flex;align-items:center;gap:8px;padding:12px 22px;background:#f7f5ee;border-bottom:1px solid #ece9df}
.step{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#a5a99d}
.step .n{width:18px;height:18px;border-radius:50%;background:#e9e6dc;display:grid;place-items:center;font-size:9.5px;font-weight:600;color:#989c90}
.step.active{color:var(--brand);font-weight:600}
.step.active .n{background:var(--brand);color:#fff}
.step.done .n{background:#d8ece3;color:var(--brand)}
.step.done{color:#7e998c}
.step-line{flex:1;height:1px;background:#e3e0d5;min-width:10px}

/* upload step 1 */
.up-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
.up-drop{border:1.5px dashed #d5d2c3;border-radius:14px;background:#fdfcf8;min-height:206px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;cursor:pointer;transition:.18s}
.up-drop:hover,.up-drop.drag{border-color:#8dbbaa;background:var(--brand-tint)}
.up-drop .ud-ic{width:52px;height:52px;border-radius:15px;background:#fff;border:1px solid #e8e5da;display:grid;place-items:center;color:var(--brand);margin-bottom:11px;box-shadow:0 6px 16px rgba(28,35,48,.06)}
.up-drop b{font-size:13px;font-weight:600}
.up-drop span{font-size:10.5px;color:#9ca094;margin-top:4px}
.up-drop .browse{margin-top:12px;font-size:11px;color:var(--brand);border-bottom:1px solid #bcd6c9;padding-bottom:1px}
.up-side h4{font-size:11px;color:#8a8f83;font-weight:600;letter-spacing:.02em;margin-bottom:6px}
.select,.input,textarea.input{
  width:100%;border:1px solid #e3e0d5;background:#fff;border-radius:9px;padding:9px 10px;font-size:12px;outline:0;transition:.15s;
}
.select:focus,.input:focus,textarea.input:focus{border-color:#a9cbbb;box-shadow:0 0 0 3px rgba(23,105,79,.07)}
textarea.input{resize:vertical;line-height:1.65}
.up-side .field + .field{margin-top:11px}
.up-side .hintbox{font-size:10px;color:#9ba08f;line-height:1.6;background:#f6f4ec;border:1px solid #ece9de;border-radius:9px;padding:9px 10px;margin-top:11px}
.file-list{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-height:150px;overflow-y:auto}
.file-chip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e8e5da;border-radius:9px;padding:6px 8px}
.file-chip .fi{width:26px;height:26px;border-radius:6px;background:#f1f5f1;color:var(--brand);display:grid;place-items:center;flex:none}
.file-chip .fn{flex:1;min-width:0}
.file-chip .fn b{display:block;font-size:10.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-chip .fn span{display:block;font-size:8.5px;color:#b1b4a7}
.file-chip .rm{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:#b3b5a9}
.file-chip .rm:hover{background:#fbeeed;color:var(--danger)}
.paste-area{min-height:190px;font-size:12.5px;line-height:1.75}

/* processing */
.processing{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px}
.proc-orb{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e9f6ef,#d7ece2);display:grid;place-items:center;position:relative;margin-bottom:14px}
.proc-orb::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid #cfe5da;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.94);opacity:.9}70%{transform:scale(1.08);opacity:0}100%{opacity:0}}
.proc-orb svg{color:var(--brand);width:28px;height:28px;animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
.processing h3{font-size:14px;font-weight:600}
.processing p{font-size:10.5px;color:#9ba08f;margin-top:3px}
.proc-steps{width:min(420px,100%);margin-top:18px;display:flex;flex-direction:column;gap:2px}
.proc-step{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-size:11.5px;color:#a2a699;transition:.2s}
.proc-step.active{background:#f4f8f5;color:#3f554a}
.proc-step.done{color:#68796e}
.proc-step .ps-ic{width:17px;height:17px;border-radius:50%;border:1px solid #ddd9cd;display:grid;place-items:center;flex:none;background:#fff}
.proc-step.active .ps-ic{border-color:#a9cdbd}
.proc-step.done .ps-ic{background:var(--brand);border-color:var(--brand);color:#fff}
.proc-step .ps-time{margin-left:auto;font-size:9px;color:#b9bcae}
.spin{width:9px;height:9px;border:1.5px solid #cfe1d8;border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.proc-bar{width:min(420px,100%);height:4px;border-radius:4px;background:#ece9df;margin-top:14px;overflow:hidden}
.proc-bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#1a7557,#37a07d);transition:width .4s ease}

/* results */
.result-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.result-head h3{font-size:13px;font-weight:650}
.result-head span{font-size:10.5px;color:#9ca094}
.rec-card{border:1px solid #e6e3d8;background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;position:relative}
.rec-card.excluded{opacity:.55}
.rec-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rec-check{width:18px;height:18px;border-radius:5px;border:1.5px solid #cfccbf;background:#fff;display:grid;place-items:center;color:#fff;flex:none;cursor:pointer}
.rec-check.on{background:var(--brand);border-color:var(--brand)}
.rec-file{font-size:10px;color:#999d91;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.conf{font-size:9px;padding:2px 7px;border-radius:20px;background:#edf6f1;color:#2f7a5e;border:1px solid #d5e9df;flex:none}
.conf.mid{background:#fdf4e3;color:#9a7228;border-color:#f0e2c2}
.rec-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.rec-fields .f{min-width:0}
.rec-fields label{display:block;font-size:9px;color:#a4a89a;margin-bottom:3px;letter-spacing:.03em}
.rec-fields .select,.rec-fields .input{padding:7px 8px;font-size:11px}
.rec-q{width:100%;min-height:88px;font-size:12px;line-height:1.65;margin-top:8px}
.rec-foot{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.tag-chip{font-size:9.5px;padding:3px 8px;border-radius:20px;border:1px solid #e7e3d7;color:#8b9083;background:#fbfaf5;cursor:pointer;transition:.14s}
.tag-chip:hover{border-color:#cbdcd3;color:var(--brand)}
.tag-chip.on{background:var(--brand-soft);border-color:#cde5d9;color:var(--brand);font-weight:550}
.rec-note{font-size:9.5px;color:#a6a99b;background:#f8f6ef;border-radius:8px;padding:8px 10px;line-height:1.6;margin-top:4px}

/* ---------- drawer ---------- */
.drawer-overlay{position:fixed;inset:0;z-index:70;background:rgba(24,30,26,.28);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.22s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(580px,94vw);background:#fbfaf6;z-index:71;
  transform:translateX(102%);transition:.28s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;
  box-shadow:-20px 0 60px rgba(20,30,24,.18);border-left:1px solid #e5e2d7;
}
.drawer.open{transform:none}
.drawer-head{padding:20px 22px 14px;background:#fff;border-bottom:1px solid #eae7dd}
.drawer-head .dh-top{display:flex;align-items:center;gap:8px}
.badge-subj{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:600;padding:3px 8px;border-radius:20px;background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 20%,#fff)}
.drawer-head h2{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.01em;margin-top:8px;line-height:1.35}
.drawer-head .dh-crumb{font-size:10.5px;color:#a0a497;margin-top:4px}
.drawer-head .close{margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#969b8f;flex:none}
.drawer-head .close:hover{background:#f3f1e9;color:var(--ink)}
.drawer-body{padding:16px 22px 24px;overflow-y:auto;flex:1}
.drawer-foot{padding:12px 22px;border-top:1px solid #eae7dd;background:#fff;display:flex;align-items:center;gap:8px;font-size:10px;color:#a5a899}
.drawer-foot .spacer{flex:1}
.note-card{background:#fff;border:1px solid #e7e4d9;border-radius:13px;padding:13px 14px;margin-bottom:14px}
.note-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.note-head b{font-size:11.5px;font-weight:650;display:flex;align-items:center;gap:6px}
.note-head button{font-size:10px;color:var(--brand);display:flex;align-items:center;gap:4px}
.note-text{font-size:12px;line-height:1.8;color:#5a6259;white-space:pre-wrap}
.note-textarea{width:100%;border:1px solid #e5e2d7;border-radius:9px;padding:10px;font-size:12px;line-height:1.8;min-height:110px;resize:vertical;outline:0;background:#fdfcf9}
.note-textarea:focus{border-color:#a9cbbb;box-shadow:0 0 0 3px rgba(23,105,79,.06)}
.mastery-line{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed #efede4;font-size:10px;color:#9fa395}
.mastery-line .mbar{flex:1;max-width:150px}
.detail-section-title{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 9px;font-size:11px;color:#8b9083;font-weight:600;letter-spacing:.03em}
.detail-section-title span{font-weight:400;color:#b0b3a5;font-size:10px}
.err-card{background:#fff;border:1px solid #e8e5da;border-radius:12px;padding:12px 13px;margin-bottom:8px;transition:.15s}
.err-card:hover{border-color:#d7d3c4;box-shadow:0 4px 14px rgba(28,35,48,.04)}
.err-top{display:flex;align-items:flex-start;gap:8px}
.err-top .star{color:#d8d3c2;flex:none;padding-top:1px}
.err-top .star.on{color:#c9922e}
.err-top .star:hover{color:#c9922e}
.err-title{flex:1;font-size:11.5px;font-weight:600;line-height:1.5}
.err-actions{display:flex;gap:2px;flex:none}
.err-actions button{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#b4b6a9}
.err-actions button:hover{background:#f4f2ea;color:var(--brand)}
.err-actions button.del:hover{background:#fbeeed;color:var(--danger)}
.err-q{font-size:10.5px;color:#83887d;line-height:1.65;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.err-meta{display:flex;align-items:center;gap:5px;margin-top:7px;flex-wrap:wrap}
.err-meta .m{font-size:9px;color:#a5a899;background:#f7f5ee;border-radius:4px;padding:1px 5px}
.err-meta .m.warn{color:#98763c;background:#fbf3e1}
.mastery-pill{font-size:9px;padding:2px 7px;border-radius:20px;background:#f2efe5;color:#8d9184}
.mastery-pill.m1{background:#fdf2dd;color:#9a7327}
.mastery-pill.m2{background:#e7f4ec;color:#2d7a5c}

/* success */
.success-wrap{text-align:center;padding:18px 0 8px}
.success-ic{width:62px;height:62px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;margin:0 auto 12px;color:var(--brand);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.success-wrap h3{font-size:16px;font-family:var(--serif);font-weight:600}
.success-wrap p{font-size:11px;color:#969b8e;margin-top:5px}

/* review modal */
.flashcard{background:#fff;border:1px solid #e6e3d7;border-radius:16px;padding:20px;min-height:260px;display:flex;flex-direction:column}
.fc-top{display:flex;align-items:center;gap:8px;font-size:10px;color:#a3a798}
.fc-top .bar{flex:1;height:3px;border-radius:3px;background:#eeece3;overflow:hidden}
.fc-top .bar i{display:block;height:100%;background:var(--brand-2);border-radius:3px;transition:.3s}
.fc-q{font-size:14px;line-height:1.8;color:#2f3a33;margin-top:16px;flex:1}
.fc-answer{margin-top:14px;padding-top:14px;border-top:1px dashed #e9e6db;font-size:12px;line-height:1.8;color:#6b746b;display:none}
.fc-answer.show{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fc-answer b{color:#3d5146;font-size:11px}
.fc-actions{display:flex;gap:8px;margin-top:16px}
.fc-actions .btn{flex:1}
.review-done{text-align:center;padding:22px 10px}
.review-done .rd-num{font-family:var(--serif);font-size:38px;color:var(--brand);line-height:1.1}
.review-done h3{font-size:15px;font-weight:600;margin-top:4px}
.review-done p{font-size:11px;color:#9a9e91;margin-top:4px}

/* editor modal */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.form-grid .full{grid-column:1/-1}
.form-grid label{display:block;font-size:10px;color:#92978a;margin-bottom:4px}
.form-grid .input,.form-grid .select{font-size:12px}
.mini-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}

/* profile / identity */
.profile-hero{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid #e6ebe3;background:linear-gradient(135deg,#f7fbf7,#fdfcf7);border-radius:12px;margin-bottom:14px}
.profile-hero .avatar{width:46px;height:46px;font-size:16px;border-width:2px;flex:none}
.profile-hero .ph-name{font-size:15px;font-weight:650;color:#2c3a31;line-height:1.3}
.profile-hero .ph-meta{font-size:10.5px;color:#8d9485;margin-top:3px}
.profile-hero .ph-badge{margin-left:auto;flex:none;font-size:9px;color:#17694f;background:#e7f3ed;border:1px solid #d2e7dc;border-radius:20px;padding:2px 8px}
.profile-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border:1px solid #ece9de;background:#fbfaf5;border-radius:9px;font-size:10px;color:#8b9285}
.profile-stats b{color:#4c554b;font-weight:650}
.profile-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* share banner */
.share-bar{display:flex;align-items:center;gap:10px;padding:7px 16px;background:#f2f8f4;border-bottom:1px solid #dbe9e0;font-size:11px;color:#3f6b58}
.share-bar b{font-size:10.5px;background:#e0f0e7;border:1px solid #cfe5d9;border-radius:20px;padding:2px 8px;flex:none}
.share-bar span{color:#6d7f72;line-height:1.5}
.share-bar .sb-act{margin-left:auto;flex:none;font-size:10.5px;color:#17694f;border:1px solid #cfe5d9;background:#fff;border-radius:7px;padding:4px 10px;cursor:pointer;font-family:inherit}
.share-bar .sb-act:hover{background:#eaf5ee}
.share-bar .sb-x{flex:none;border:0;background:transparent;color:#8a9a8d;font-size:15px;line-height:1;cursor:pointer;padding:2px 4px}
@media(max-width:720px){.share-bar{flex-wrap:wrap;gap:6px;padding:7px 12px}.share-bar span{flex:1 1 100%;order:3}.share-bar .sb-act{margin-left:auto}}

/* toast */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{background:#26332c;color:#f4f8f3;font-size:11.5px;padding:9px 15px;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.24);display:flex;align-items:center;gap:7px;opacity:0;transform:translateY(8px);animation:toastIn .25s forwards}
.toast svg{width:14px;height:14px;color:#7fd0aa}
.toast.act{pointer-events:auto;padding-right:7px;gap:10px}
.toast-act{background:rgba(255,255,255,.15);border:0;color:#eaf6ef;font:inherit;font-size:11px;padding:4px 10px;border-radius:7px;cursor:pointer;transition:background .15s}
.toast-act:hover{background:rgba(255,255,255,.28)}
@keyframes toastIn{to{opacity:1;transform:none}}

/* ---------- edition / version ---------- */
.chapter-title{align-items:center}
.chapter-title > span{display:flex;align-items:center;gap:6px;min-width:0}
.chapter-title > span b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px}
.ver-pill{
  display:inline-flex;align-items:center;gap:4px;font-size:9.5px;line-height:1;padding:4px 7px;
  border-radius:20px;border:1px solid #e6e3d7;background:#fff;color:#7d8376;white-space:nowrap;transition:.15s;
}
.ver-pill:hover{border-color:#bed8cc;color:var(--brand);background:var(--brand-tint)}
.ver-pill.on{color:var(--brand);border-color:#d4e7dd;background:var(--brand-soft)}
.section-head .ver-pill{padding:4px 8px;font-size:9.5px}
.version-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.version-tabs button{font-size:11px;padding:5px 11px;border-radius:20px;border:1px solid #e6e3d7;background:#fbfaf5;color:#7d8376;transition:.15s}
.version-tabs button:hover{border-color:#c7dcd1;color:var(--brand)}
.version-tabs button.on{background:var(--brand-soft);border-color:#cde5d9;color:var(--brand);font-weight:600}
.ver-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ver-card{text-align:left;padding:12px 13px;border:1px solid #e8e5da;background:#fff;border-radius:12px;transition:.15s;position:relative}
.ver-card:hover{border-color:#cdded5;box-shadow:0 5px 16px rgba(28,35,48,.05)}
.ver-card.on{border-color:#9fc8b6;background:linear-gradient(180deg,#f7fcf9,#fff);box-shadow:0 0 0 3px rgba(23,105,79,.06)}
.ver-card .vc-top{display:flex;align-items:center;gap:7px}
.ver-card .vc-top b{font-size:12px;font-weight:650}
.ver-card .vc-now{font-size:8.5px;color:var(--brand);background:var(--brand-soft);border-radius:20px;padding:1px 6px}
.ver-card .vc-check{margin-left:auto;width:16px;height:16px;border-radius:50%;border:1.5px solid #d7d4c8;display:grid;place-items:center;color:#fff}
.ver-card.on .vc-check{background:var(--brand);border-color:var(--brand)}
.ver-chapters{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.ver-chapters span{font-size:8.5px;color:#94998d;background:#f7f5ee;border-radius:4px;padding:1px 5px}
.ver-note{font-size:10px;color:#9ba08f;line-height:1.7;background:#f6f4ec;border:1px solid #ece9de;border-radius:9px;padding:10px 12px;margin-top:12px}
.ver-subject-hint{font-size:10.5px;color:#a0a497;margin-bottom:10px}
.cat-stats{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 12px}
.cat-stat{flex:1;min-width:86px;background:#f7f9f5;border:1px solid #e7eee8;border-radius:10px;padding:8px 10px}
.cat-stat b{display:block;font-size:15px;color:#17694f;letter-spacing:-.01em}
.cat-stat span{display:block;font-size:9px;color:#9aa294;margin-top:2px}
.cat-books{max-height:270px;overflow:auto;border:1px solid #eae7db;border-radius:10px;background:#fff;padding:2px 8px}
.cat-book{border-bottom:1px solid #f0eee5}
.cat-book:last-child{border-bottom:0}
.cat-book summary{display:flex;align-items:center;gap:8px;padding:8px 3px;cursor:pointer;font-size:11.5px;font-weight:600;color:#4c554b;list-style:none}
.cat-book summary::-webkit-details-marker{display:none}
.cat-book summary::before{content:'›';font-size:14px;color:#a9b0a2;transition:.15s;display:inline-block}
.cat-book[open] summary::before{transform:rotate(90deg)}
.cat-book summary span{margin-left:auto;font-size:9.5px;color:#a4aa9c;font-weight:400}
.cat-ck{flex:none;font-style:normal;font-size:8.5px;padding:1px 6px;border-radius:20px;border:1px solid #e7e4d9;color:#a2a89a;background:#faf9f4}
.cat-ck.ok{color:#17694f;background:#eef6f1;border-color:#d8e8df}
.cat-ck.issue{color:#9a5a1e;background:#fdf3e4;border-color:#f0dfc2}
.cat-check{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:0 3px 8px 15px}
.cat-check .input{flex:1;min-width:110px;font-size:10.5px;padding:4px 7px}
.cat-check .mini{font-size:9.5px;padding:3px 8px;border-radius:6px;border:1px solid #e5e2d7;background:#fff;color:#6f766b;cursor:pointer;font-family:inherit}
.cat-check .mini:hover{border-color:#c9d4c6;color:#17694f}
.cat-check .mini.on{background:#eef6f1;border-color:#bcd8c9;color:#17694f}
.cat-chapters{padding:0 3px 8px 15px}
.cat-ch{display:flex;gap:10px;align-items:baseline;padding:3px 0;font-size:10.5px;color:#6b7368;line-height:1.5}
.cat-ch span{min-width:0}
.cat-ch em{margin-left:auto;flex:none;font-style:normal;font-size:9px;color:#b0b5a8}
.cat-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.cat-add{margin-top:12px;background:#fbfaf5;border:1px solid #ece9de;border-radius:10px;padding:10px 11px}
.cat-add .row{display:grid;grid-template-columns:1.1fr 1.3fr;gap:8px}
.cat-add label{display:block;font-size:9px;color:#9aa08f;margin-bottom:4px}
.cat-add .full{margin-top:8px}
.cat-add .input,.cat-add .select{font-size:11px}
.cat-warn{margin-top:10px;background:#fdf8ec;border:1px solid #f0e4c8;border-radius:9px;padding:9px 11px;font-size:10px;color:#8a7240;line-height:1.7}
.cat-warn b{color:#7a5d1e}
.cat-unmatched{margin-top:4px;font-size:9.5px;color:#9a8a63;line-height:1.7}
.cat-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;padding:2px 7px;border-radius:20px;background:#eef6f1;color:#17694f;border:1px solid #d8e8df}
.cat-badge.school{background:#fdf6e8;color:#8a6420;border-color:#f0e2c4}
.cat-source{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:-4px 0 10px}
.cat-source .cat-meta{font-size:9.5px;color:#a0a497;line-height:1.6}
.cat-add-inline{display:flex;gap:7px;align-items:center}
.cat-add-inline .input{flex:1;min-width:0}
.cat-add-inline .btn{flex:none;white-space:nowrap}
.cat-add-title{font-size:10.5px;font-weight:650;color:#5d655b;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.cat-add-title span{font-size:9px;color:#a4aa9c;font-weight:400}
.cat-note{margin-top:10px;background:#f2f8f4;border:1px solid #d8e8df;border-radius:9px;padding:9px 11px;font-size:10px;color:#3f6b58;line-height:1.7}
.cat-note.warn{background:#fdf8ec;border-color:#f0e4c8;color:#8a7240}
.cat-fb{margin-top:10px;border:1px solid #ece9de;border-radius:10px;background:#fbfaf5;overflow:hidden}
.cat-fb summary{list-style:none;cursor:pointer;padding:9px 11px;font-size:11px;font-weight:600;color:#5d655b;display:flex;align-items:center;gap:6px}
.cat-fb summary::-webkit-details-marker{display:none}
.cat-fb summary::before{content:'›';font-size:14px;color:#a9b0a2;transition:.15s}
.cat-fb[open] summary::before{transform:rotate(90deg)}
.cat-fb summary span{margin-left:auto;font-size:9px;color:#a4aa9c;font-weight:400}
.cat-fb-body{padding:0 11px 11px}
.cat-fb-body .row{display:grid;grid-template-columns:.9fr 1.1fr;gap:7px;margin-bottom:7px}
.cat-fb-body .select,.cat-fb-body .input,.cat-fb-body textarea{font-size:11px}
.cat-fb-body textarea{min-height:54px;margin-bottom:7px;resize:vertical}
.cat-fb-actions{display:flex;gap:7px;justify-content:flex-end}
.tag-warn{font-size:9px;padding:1px 6px;border-radius:20px;background:#fdf3df;color:#a1731f;border:1px solid #f0e2c4;font-weight:500}
.chapter-book.warn span{color:#a1731f}
.chapter-item.legacy{color:#8a7240}
.chapter-item.legacy.active{background:#fdf6e8;color:#8a6420}


/* ---------- reason picker ---------- */
.reason-picker{display:flex;flex-direction:column;gap:6px;background:#fbfaf5;border:1px solid #ece9de;border-radius:10px;padding:9px 10px}
.reason-group{display:flex;gap:7px;align-items:flex-start}
.reason-group .rg-name{font-size:8.5px;color:#9ca094;flex:none;width:36px;padding-top:4px;letter-spacing:.02em}
.reason-group .rg-tags{display:flex;gap:5px;flex-wrap:wrap;min-width:0}
.reason-group .tag-chip{font-size:9px;padding:2px 7px}
.custom-reason{display:flex;gap:6px;margin-top:7px}
.custom-reason .input{height:32px;padding:5px 9px;font-size:11px}
.rec-custom{margin-top:7px}
.rec-custom input{height:29px;padding:4px 8px;font-size:10.5px;border-style:dashed}
.reason-summary{display:flex;gap:5px;flex-wrap:wrap}

/* ---------- upload image analysis ---------- */
.img-summary{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:9.5px;color:#8e9487;background:#f6f8f4;border:1px solid #e6ece6;border-radius:8px;padding:6px 9px;margin-top:8px}
.img-summary b{font-weight:600;color:#5e6d61}
.img-summary .warn{color:#a47625;background:#fbf1df;border-radius:20px;padding:1px 6px}
.img-summary .ok{color:#2f7a5e;background:#eaf5ef;border-radius:20px;padding:1px 6px}
.file-chip{align-items:flex-start}
.file-chip .thumb{width:38px;height:38px;border-radius:8px;overflow:hidden;background:#f1f5f1;color:var(--brand);display:grid;place-items:center;flex:none;border:1px solid #e8ece6}
.file-chip .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.file-chip .fn b{margin-top:1px}
.file-chip .fn .flags{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.file-chip .fn .flags em{font-style:normal;font-size:8px;padding:0 4px;border-radius:3px;background:#f2f0e9;color:#9a9e92}
.file-chip .fn .flags em.warn{background:#fbf1df;color:#a47625}
.file-chip .fn .flags em.ok{background:#eaf5ef;color:#2f7a5e}
.file-chip.blurry{border-color:#efdcb8;background:#fffdf8}
.switch-row{display:flex;align-items:center;gap:7px;font-size:10px;color:#8b9083;margin-top:8px;cursor:pointer;user-select:none}
.switch-row input{width:13px;height:13px;accent-color:#17694f}

/* ---------- proofreading ---------- */
.rec-proof{display:grid;grid-template-columns:224px minmax(0,1fr);gap:13px;align-items:start}
.proof-pane{position:sticky;top:0;background:#f8f7f1;border:1px solid #e8e5da;border-radius:11px;padding:8px}
.proof-label{display:flex;align-items:center;justify-content:space-between;font-size:9px;color:#8b9083;margin-bottom:5px}
.proof-label span{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:#5d6b61}
.proof-label button{font-size:9px;color:var(--brand);text-decoration:underline;text-underline-offset:2px}
.proof-img{border-radius:7px;overflow:hidden;background:#efece3;max-height:300px;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.proof-img img{width:100%;height:auto;max-height:300px;object-fit:contain;display:block}
.proof-meta{font-size:8.5px;color:#a2a699;margin-top:6px;line-height:1.6}
.proof-meta em{font-style:normal;color:#a47625}
.proof-tip{font-size:8.5px;color:#b0b3a6;line-height:1.55;margin-top:4px;padding-top:5px;border-top:1px dashed #e5e2d7}
.rec-editor{min-width:0}
.rec-title-input{width:100%;border:1px solid #e3e0d5;background:#fff;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:600;outline:0}
.rec-title-input:focus{border-color:#a9cbbb;box-shadow:0 0 0 3px rgba(23,105,79,.07)}
.rec-q.low{border-color:#ead8b5;background:#fffdf8}

/* ---------- duplicate ---------- */
.dup-banner{display:flex;align-items:center;gap:9px;border:1px solid #f0dfbd;background:linear-gradient(180deg,#fffaf0,#fffdf8);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.dup-banner .dup-ic{width:26px;height:26px;border-radius:8px;background:#fbf0d8;color:#a47625;display:grid;place-items:center;flex:none}
.dup-copy{flex:1;min-width:0;font-size:9.5px;color:#8f7c58;line-height:1.5}
.dup-copy b{color:#7c5d25;font-weight:650;margin-right:3px}
.dup-copy span{display:block;color:#a9a08c;font-size:8.5px;margin-top:1px}
.dup-actions{display:flex;gap:4px;flex:none}
.dup-actions button{font-size:9px;padding:3px 7px;border-radius:6px;border:1px solid #e9e3d5;background:#fff;color:#938a78}
.dup-actions button.on{background:#17694f;border-color:#17694f;color:#fff}

/* ---------- similar ---------- */
.sim-list{display:flex;flex-direction:column;gap:6px}
.sim-card{display:flex;align-items:center;gap:9px;text-align:left;padding:9px 10px;border:1px solid #e8e5da;background:#fff;border-radius:10px;transition:.15s;width:100%}
.sim-card:hover{border-color:#cfded6;background:#fdfcf8}
.sim-card .sc-ic{width:25px;height:25px;border-radius:7px;background:#f3f6f2;color:var(--brand);display:grid;place-items:center;flex:none}
.sim-card .sc-main{flex:1;min-width:0}
.sim-card .sc-main b{display:block;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sim-card .sc-main span{display:block;font-size:8.5px;color:#a5a899;margin-top:1px}
.sim-card .sc-go{font-size:9px;color:#a8ab9d;flex:none}
.sim-actions{display:flex;gap:6px;margin-top:8px}
.sim-actions .btn{flex:1}

/* ---------- report ---------- */
.report-hero{display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,#fffdf8,#f3f7f2);border:1px solid #e4e7dc;border-radius:18px;padding:20px 22px;flex:none;box-shadow:var(--shadow);position:relative;overflow:hidden}
.report-hero::after{content:"";position:absolute;right:-40px;top:-70px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(23,105,79,.1),transparent 68%)}
.report-copy{flex:1;min-width:0;position:relative}
.report-copy h2{font-family:var(--serif);font-size:21px;font-weight:600}
.report-copy p{font-size:11.5px;color:#7f857a;margin-top:5px;line-height:1.6}
.report-copy .rep-range{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;color:#9ba092;margin-top:8px;background:#fff;border:1px solid #ece9de;border-radius:20px;padding:3px 8px}
.rep-actions{display:flex;gap:7px;flex:none;align-items:center;position:relative}
.rep-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;flex:none}
.rep-kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 13px;position:relative;overflow:hidden}
.rep-kpi b{display:block;font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.1;color:#22352b;font-variant-numeric:tabular-nums}
.rep-kpi b small{font-family:var(--sans);font-size:10px;color:var(--muted);font-weight:500;margin-left:2px}
.rep-kpi span{display:block;font-size:9.5px;color:#9a9e91;margin-top:4px}
.rep-kpi em{font-style:normal;font-size:8.5px;color:var(--brand);background:var(--brand-soft);border-radius:20px;padding:1px 5px;margin-left:4px}
.rep-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:10px}
.rep-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 15px}
.rep-card > header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:11px}
.rep-card > header h3{font-size:12px;font-weight:650}
.rep-card > header p{font-size:9px;color:#a8ab9e;margin-top:2px}
.rep-card > header .rep-tag{font-size:8.5px;color:#9ea295;background:#f6f4ec;border-radius:20px;padding:2px 6px}
.trend{display:flex;align-items:flex-end;gap:7px;height:108px;padding-top:4px}
.trend-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.trend-bars{display:flex;align-items:flex-end;gap:2px;height:84px;width:100%;justify-content:center}
.trend-bars i{display:block;width:8px;border-radius:3px 3px 1px 1px;min-height:2px;transition:.25s}
.trend-bars .new{background:#79bfa4}
.trend-bars .rev{background:#d8bf8c}
.trend-col span{font-size:8px;color:#b0b3a6;white-space:nowrap}
.trend-col.today span{color:var(--brand);font-weight:600}
.trend-legend{display:flex;gap:10px;font-size:8.5px;color:#a5a99d;margin-top:6px}
.trend-legend i{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:3px}
.dist-row{display:flex;align-items:center;gap:8px;margin-top:7px}
.dist-row .dn{width:30px;font-size:9.5px;color:#6f766b;flex:none}
.dist-row .dbar{flex:1;height:6px;border-radius:6px;background:#f0eee6;overflow:hidden}
.dist-row .dbar i{display:block;height:100%;border-radius:6px;background:var(--c);opacity:.72}
.dist-row .dv{width:26px;text-align:right;font-size:9px;color:#9ba092;font-variant-numeric:tabular-nums}
.reason-groups{display:flex;flex-direction:column;gap:8px}
.reason-grow{display:flex;align-items:center;gap:8px}
.reason-grow .rg-label{width:58px;font-size:9px;color:#8b9083;flex:none}
.reason-grow .rg-bar{flex:1;height:7px;border-radius:7px;background:#f1efe7;overflow:hidden}
.reason-grow .rg-bar i{display:block;height:100%;border-radius:7px;background:var(--c);opacity:.75}
.reason-grow .rg-num{width:24px;text-align:right;font-size:9px;color:#9ba092}
.reason-top{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px dashed #efede4}
.reason-top .tag-chip{font-size:9px;padding:2px 7px;cursor:default}
.weak-mini{display:flex;flex-direction:column;gap:5px}
.weak-mini button{display:flex;align-items:center;gap:8px;text-align:left;padding:7px 8px;border-radius:8px;transition:.15s}
.weak-mini button:hover{background:#fbfaf5}
.weak-mini .wm-main{flex:1;min-width:0}
.weak-mini .wm-main b{display:block;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weak-mini .wm-main span{display:block;font-size:8.5px;color:#a5a899;margin-top:1px}
.weak-mini .wm-badge{font-size:8.5px;color:#98763c;background:#fbf3e1;border-radius:20px;padding:1px 6px;flex:none}
.advice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.advice{display:flex;gap:8px;padding:10px 11px;border:1px solid #e9e7dc;border-radius:11px;background:linear-gradient(180deg,#fff,#fdfcf8);text-align:left;transition:.15s}
.advice:hover{border-color:#cdded5;box-shadow:0 5px 14px rgba(28,35,48,.045)}
.advice .ad-ic{width:26px;height:26px;border-radius:8px;background:#eef5f0;color:var(--brand);display:grid;place-items:center;flex:none}
.advice .ad-main{flex:1;min-width:0}
.advice .ad-main b{display:block;font-size:10.5px;font-weight:650;line-height:1.4}
.advice .ad-main span{display:block;font-size:8.5px;color:#a1a597;line-height:1.55;margin-top:2px}

/* ---------- image lightbox ---------- */
.img-modal{width:min(880px,100%);max-height:calc(100vh - 48px);background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(15,25,20,.3)}
.img-modal .im-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #ece9df;font-size:12px;font-weight:600}
.img-modal .im-head button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#969b8f}
.img-modal .im-head button:hover{background:#f3f1e9;color:var(--ink)}
.img-modal .im-body{padding:12px;overflow:auto;background:#f5f3ec;display:flex;align-items:center;justify-content:center}
.img-modal img{max-width:100%;max-height:calc(100vh - 140px);object-fit:contain;border-radius:6px;background:#fff}

@media (max-width:860px){
  .rep-kpis{grid-template-columns:1fr 1fr}
  .rep-grid{grid-template-columns:1fr}
  .advice-grid{grid-template-columns:1fr}

  .rep-actions{width:100%}
  .rec-proof{grid-template-columns:1fr}

  .proof-img{max-height:110px}
  .proof-img img{max-height:110px}
  .proof-meta,.proof-tip{grid-column:2}
  .ver-list{grid-template-columns:1fr}

}
@media (max-width:520px){

}

@media (max-width:1280px){

}
@media (max-width:1120px){

  .right{grid-column:1/-1;display:grid;grid-template-columns:1.1fr .9fr .9fr;align-items:start}
  .left{max-height:calc(100vh - 88px);position:sticky;top:80px}
  .center{order:2}
  .right{order:3}
}
@media (max-width:860px){
  .app{display:flex;flex-direction:column;height:auto}
  .fab-upload{
    display:flex;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:55;

    background:linear-gradient(180deg,#1a7557,#106147);color:#fff;font-size:13px;font-weight:600;
    box-shadow:0 10px 26px rgba(16,97,71,.32);border:1px solid rgba(255,255,255,.16);

  .left-card{max-height:none}
  .center{order:1}
  .right{order:2}
  .left{order:3}
  .subj-list{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px;overflow:visible}
  .chapter-panel{display:none}
  .right{display:flex;flex-direction:column;align-items:stretch}
  .subject-grid{grid-template-columns:1fr 1fr}
  .hero-inner{flex-direction:column;align-items:flex-start}
  .hero-stats{width:100%;justify-content:space-between}
  .up-grid{grid-template-columns:1fr}
  .rec-fields{grid-template-columns:1fr 1fr}
  .brand{min-width:0}
  .btn-upload{height:46px}
}
@media (max-width:700px){
  .nav button span.lbl{display:none}
}
@media (max-width:520px){
  .topbar{padding:0 12px;gap:10px}
  .brand-txt span{display:none}
  .brand-txt b{font-size:14px}
  .nav button{padding:7px 9px}
  .avatar-meta{display:none}
  .top-right{gap:2px}
}

  .brand-txt{display:none}
  .brand{min-width:auto}
  .nav{gap:2px;padding:3px}
