    if(rm){ upload.files.splice(Number(rm.dataset.rm),1); renderUpload(); return; }
    const chk=e.target.closest('[data-check]');
    if(chk){
      const i=Number(chk.dataset.check), r=upload.results[i];
      if(!r) return;
      r.include=!r.include;
      chk.classList.toggle('on',r.include);
      chk.innerHTML=r.include?icon('check',11):'';
      const card=chk.closest('.rec-card'); if(card) card.classList.toggle('excluded',!r.include);
      refreshUploadFooter();
      return;
    }
    const reason=e.target.closest('[data-reason]');
    if(reason){
      const i=Number(reason.dataset.reason), r=upload.results[i];
      if(!r) return;
      const v=reason.dataset.val;
      r.reasons=r.reasons||[];
      if(r.reasons.includes(v)) r.reasons=r.reasons.filter(x=>x!==v);
      else r.reasons.push(v);
      reason.classList.toggle('on',r.reasons.includes(v));
      return;
    }
    const dup=e.target.closest('[data-dup]');
    if(dup){
      const i=Number(dup.dataset.dup), r=upload.results[i];
      if(!r||!r.dup) return;
      r.dupAction=dup.dataset.val;
      rerenderUploadKeepScroll();
    }
  });
  um.addEventListener('input',e=>{
    const el=e.target.closest('[data-ri][data-f]'); if(!el||!upload) return;
    const r=upload.results[Number(el.dataset.ri)]; if(!r) return;
    r[el.dataset.f]=el.value;
  });
  um.addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    const inp=e.target.closest('[data-reason-input]');
    if(!inp||!upload) return;
    e.preventDefault();
    const i=Number(inp.dataset.reasonInput);
    const v=inp.value.trim();
    if(!v) return;
    if(!addCustomTag(v)) return;
    const r=upload.results[i];
    if(!r) return;
    r.reasons=r.reasons||[];
    if(!r.reasons.includes(v)) r.reasons.push(v);
    rerenderUploadKeepScroll();
  });
  um.addEventListener('change',e=>{
    const el=e.target.closest('[data-ri][data-f]'); if(!el||!upload) return;
    const r=upload.results[Number(el.dataset.ri)]; if(!r) return;
    const f=el.dataset.f;
    r[f]=el.value;
    if(f==='subject'){
      const chs=Object.keys(curric()[r.subject].chapters);
      r.chapter=chs[0];
      r.point=curric()[r.subject].chapters[r.chapter][0];
      renderUpload();
    } else if(f==='chapter'){
      r.point=(curric()[r.subject].chapters[r.chapter]||[])[0]||'';
      renderUpload();
    }
  });

  window.addEventListener('dragover',e=>{
    if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')) e.preventDefault();
  });
  window.addEventListener('drop',e=>{
    if(!e.dataTransfer||!e.dataTransfer.files.length) return;
    e.preventDefault();
    if($('#uploadOverlay').classList.contains('open')){
      if(upload&&upload.step===1) addFiles(e.dataTransfer.files);
    } else {
      openUpload('file',e.dataTransfer.files);
    }
  });
}

function refreshUploadFooter(){
  if(!upload) return;
  const n=upload.results.filter(r=>r.include).length;
  const merge=upload.results.filter(r=>r.include&&r.dup&&r.dupAction==='merge').length;
  const add=Math.max(0,n-merge);
  const note=document.querySelector('#uploadModal .left-note');
  if(note) note.innerHTML=`${icon('check',11)}${n} 道待入库${merge?` · ${merge} 道将合并`:''}`;
  const btn=document.querySelector('#uploadModal [data-act="confirmUpload"]');
  if(btn) btn.innerHTML=`${icon('check',14)}确认入库（新增 ${add}${merge?` · 合并 ${merge}`:''}）`;
}

/* ---------------- app init ---------------- */
function initApp(){
  renderAll();

  const nav=$('#nav');
  if(nav) nav.addEventListener('click',e=>{
    const b=e.target.closest('button[data-view]'); if(!b) return;
    ui.view=b.dataset.view;
    if(ui.view==='kb') ui.query='';
    renderAll();
    const c=$('#center'); if(c) c.scrollTop=0;
    const r=document.querySelector('.right'); if(r) r.scrollTop=0;
  });

  const reset=$('#btnReset'); if(reset) reset.addEventListener('click',resetDemo);
  const help=$('#btnHelp'); if(help) help.addEventListener('click',showHelp);
  const bell=$('#btnBell'); if(bell) bell.addEventListener('click',showNotifications);
  const avatar=document.querySelector('.top-right .avatar-wrap'); if(avatar) avatar.addEventListener('click',openProfileSetup);
  renderProfile();
  maybeOnboard();

  bindUploadEvents();

  document.addEventListener('click',e=>{
    const pickRow=e.target.closest('[data-pick]');
    if(pickRow){ togglePick(pickRow.dataset.pick); return; }
    const quick=e.target.closest('[data-pk]');
    if(quick&&picker){
      if(quick.dataset.pk==='due') picker.due=!picker.due;
      if(quick.dataset.pk==='star') picker.star=!picker.star;
      renderPicker();
      return;
    }
    const el=e.target.closest('[data-act]');
    if(!el) return;
    handleAct(el.dataset.act,el);
  });

  [['uploadOverlay',()=>closeUpload()],['reviewOverlay',()=>closeReview()],['editOverlay',()=>closeEdit()],['versionOverlay',()=>closeVersion()],['imageOverlay',()=>closeImage()],['ocrOverlay',()=>closeOcr()],['pickOverlay',()=>closePicker()],['paperOverlay',()=>closePaper()],['drawerOverlay',()=>closeDrawer()]].forEach(([id,fn])=>{
    const node=document.getElementById(id);
    if(node) node.addEventListener('click',e=>{ if(e.target===node) fn(); });
  });

  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&String(e.key).toLowerCase()==='k'){
      e.preventDefault();
      if(ui.view!=='kb'){ ui.view='kb'; ui.query=''; renderAll(); }
      const s=$('#searchInput'); if(s) s.focus();
      return;
    }
    if(e.key==='Escape'){
      if($('#paperOverlay').classList.contains('open')){ closePaper(); return; }
      if($('#pickOverlay').classList.contains('open')){ closePicker(); return; }
      if($('#ocrOverlay').classList.contains('open')){ closeOcr(); return; }
      if($('#imageOverlay').classList.contains('open')){ closeImage(); return; }
      if($('#versionOverlay').classList.contains('open')){ closeVersion(); return; }
      if($('#uploadOverlay').classList.contains('open')){ closeUpload(); return; }
      if($('#reviewOverlay').classList.contains('open')){ closeReview(); return; }
      if($('#editOverlay').classList.contains('open')){ closeEdit(); return; }
      if($('#drawer').classList.contains('open')){ closeDrawer(); return; }
    }
  });

  $('#searchInput')?.addEventListener('input',()=>{});
  updateOcrUI();
  checkOcr();
  gcAssets();
}

initApp();
</script>
