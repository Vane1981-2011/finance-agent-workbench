  .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .search{grid-column:1/-1;min-width:0}
  .search kbd{display:none}
  .chips{grid-column:1/-1}
  .chips button{flex:1;padding:5px 6px}
  .toolbar .ghost-btn{justify-content:center;width:100%;font-size:11px}
}

/* ============================================================
   本地 OCR 状态 / 服务设置
   ============================================================ */
.ocr-line{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin-top:9px;padding:7px 10px;border-radius:9px;background:#f6f4ec;border:1px solid #ece9de;font-size:10px;color:#8b9083;text-align:left;transition:.16s}
.ocr-line:hover{background:#f2f8f4;border-color:#d8e8df}
.ocr-set{color:var(--brand);font-size:10px;flex:none;border-bottom:1px solid #bcd6c9;padding-bottom:1px}
.ocr-pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:550;color:#8b9083;min-width:0}
.ocr-pill>span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocr-pill .dot{width:6px;height:6px;border-radius:50%;background:#bbb8ac;flex:none}
.ocr-pill.online{color:var(--brand)}
.ocr-pill.online .dot{background:var(--brand-2);box-shadow:0 0 0 3px rgba(14,138,101,.14)}
.ocr-pill.offline{color:#a2792a}
.ocr-pill.offline .dot{background:#d6a441}
.ocr-pill.checking .dot{background:#9fb7ab;animation:pulseDot 1.1s infinite}
@keyframes pulseDot{50%{opacity:.3}}
.ocr-box{background:#f7f5ee;border:1px solid #ece9de;border-radius:10px;padding:10px;margin-top:11px}
.ob-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ob-head button{font-size:10px;color:var(--brand);text-decoration:underline;text-underline-offset:2px;flex:none}
.ocr-box p{font-size:9.5px;color:#9ba08f;line-height:1.6;margin-top:6px}
.ocr-state{font-size:10.5px;font-weight:600}
.ocr-state.online{color:var(--brand)}
.ocr-state.offline{color:#a2792a}
.ocr-state.checking{color:#8b9083}
.ocr-status-box{display:flex;gap:10px;align-items:flex-start;background:#f7f5ee;border:1px solid #ece9de;border-radius:11px;padding:11px 12px}
.ocr-status-box .dot{width:8px;height:8px;border-radius:50%;background:#bbb8ac;margin-top:4px;flex:none}
.ocr-status-box.online{background:var(--brand-tint);border-color:#d8e8df}
.ocr-status-box.online .dot{background:var(--brand-2);box-shadow:0 0 0 3px rgba(14,138,101,.14)}
.ocr-status-box.offline{background:#fdf8ec;border-color:#f0e4c8}
.ocr-status-box.offline .dot{background:#d6a441}
.ocr-status-box.checking .dot{background:#9fb7ab;animation:pulseDot 1.1s infinite}
.ocr-status-box b{display:block;font-size:12px}
.ocr-status-box span{display:block;font-size:10px;color:#8b9083;line-height:1.6;margin-top:2px}
.ocr-actions{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap}
.ocr-err{font-size:10px;color:#b0563f}
.ocr-guide{margin-top:14px;background:#fbfaf5;border:1px dashed #e2dfd2;border-radius:10px;padding:11px 12px;font-size:10px;color:#8b9083;line-height:1.7}
.ocr-guide b{display:block;font-size:10.5px;color:#6e756a;margin-bottom:3px}
.ocr-guide ol{margin:0 0 5px;padding-left:16px}
.ocr-guide li{margin:2px 0}
.ocr-guide span{display:flex;gap:5px;align-items:flex-start;color:#a3a798}

/* 演示识别标注 */
.demo-banner{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#fdf8ec;border:1px solid #f0e2c2;border-radius:11px;margin:2px 0 12px}
.demo-banner .db-ic{width:28px;height:28px;border-radius:8px;background:#fff;color:#b8892d;display:grid;place-items:center;flex:none;border:1px solid #f2e6cb}
.demo-banner .db-copy{flex:1;min-width:0}
.demo-banner .db-copy b{display:block;font-size:11.5px;color:#8a6420}
.demo-banner .db-copy span{display:block;font-size:9.5px;color:#a58b57;line-height:1.6;margin-top:1px}
.card-demo-hint{font-size:9.5px;color:#9a7228;background:#fdf8ec;border:1px solid #f3e7cc;border-radius:7px;padding:6px 8px;margin-bottom:8px;display:flex;gap:5px;align-items:flex-start;line-height:1.6}
.card-demo-hint svg{flex:none;margin-top:2px}
.conf.ocr{background:#eef4f1;color:#3d6b57;border-color:#dbe7e0}

/* ============================================================
   原图回看 / 附件
   ============================================================ */
.im-tools{display:flex;align-items:center;gap:7px;margin-left:auto}
.im-tab{font-size:10px;padding:4px 9px;border-radius:7px;border:1px solid #e6e3d8;color:#8b9083;background:#fbfaf5}
.im-tab.on{background:var(--brand-soft);border-color:#cde5d9;color:var(--brand);font-weight:600}
.im-dl{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--brand);padding:4px 8px;border-radius:7px;border:1px solid #dbe7e0;background:#f4faf7}
.im-dl:hover{background:var(--brand-soft)}
.im-foot{padding:8px 16px;border-top:1px solid #ece9df;font-size:10px;color:#9ba08f;background:#fbfaf5;line-height:1.6}
.pdf-only{flex-direction:column;gap:8px;padding:38px 20px;text-align:center;color:#7c8294}
.pdf-ic{width:56px;height:56px;border-radius:15px;background:#f2f5f2;color:var(--brand);display:grid;place-items:center;border:1px solid #e5ebe6}
.pdf-only b{font-size:13px;color:var(--ink)}
.pdf-only p{font-size:10.5px;line-height:1.7;max-width:340px}
.err-atts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.att-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;border:1px solid #e6e3d8;background:#fbfaf5;font-size:9.5px;color:#7c8294;max-width:100%;transition:.15s}
.att-chip:hover{border-color:#c9e0d5;background:var(--brand-tint);color:var(--brand)}
.att-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.att-chip em{font-style:normal;color:var(--brand);flex:none}
.att-chip svg{flex:none}
.att-chip.static{background:#fff}
.att-chip .rm{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;color:#b3b5a9;flex:none}
.att-chip .rm:hover{background:var(--danger-soft);color:var(--danger)}
.edit-atts{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px dashed #e2dfd2;border-radius:9px;background:#fcfbf7;min-height:38px;align-items:center}
.att-empty{font-size:10.5px;color:#a4a89a}

/* ============================================================
   选题组卷 / 批量管理
   ============================================================ */
.pick-modal{
  width:min(900px,100%);height:min(780px,calc(100vh - 48px));
  display:flex;flex-direction:column;background:#fcfbf7;border-radius:20px;overflow:hidden;
  box-shadow:0 30px 80px rgba(15,25,20,.3);transform:translateY(10px) scale(.99);transition:.22s;
}
.overlay.open .pick-modal{transform:none}
.pick-modal .modal-head{flex:none}
.pick-filters{display:grid;grid-template-columns:1fr 1.1fr 1.1fr 1.25fr;gap:8px;padding:13px 20px;background:#faf9f4;border-bottom:1px solid #ece9de;flex:none}
.pick-filters .select{padding:8px 9px;font-size:11px}
.pk-search{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #e3e0d5;border-radius:9px;padding:0 9px;color:#a4a89a;min-width:0}
.pk-search input{border:0;outline:0;background:transparent;width:100%;padding:8px 0;font-size:11px;color:var(--ink);min-width:0}
.pick-quick{display:flex;align-items:center;gap:8px;padding:10px 20px 0;flex:none;flex-wrap:wrap}
.chip-btn{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:5px 10px;border-radius:20px;border:1px solid #e3e0d5;color:#7c8294;background:#fff;transition:.15s}
.chip-btn:hover{border-color:#c9e0d5;color:var(--brand)}
.chip-btn.on{background:var(--brand-soft);border-color:#cde5d9;color:var(--brand);font-weight:600}
.pk-tip{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;color:#a4a89a}
.pick-count{margin-left:auto;font-size:10px;color:#8b9083;white-space:nowrap}
.pick-list{flex:1;min-height:120px;overflow-y:auto;padding:10px 20px 4px}
.pick-row{width:100%;display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid #e8e5da;border-radius:10px;background:#fff;margin-bottom:6px;text-align:left;transition:.14s}
.pick-row:hover{border-color:#cfe2d8;background:#fcfdfb}
.pick-row.on{border-color:#9fcdb9;background:var(--brand-tint);box-shadow:inset 2px 0 0 var(--brand)}
.pk-check{width:18px;height:18px;border-radius:5px;border:1.5px solid #cfccbf;background:#fff;display:grid;place-items:center;color:#fff;flex:none}
.pick-row.on .pk-check{background:var(--brand);border-color:var(--brand)}
.pk-main{flex:1;min-width:0}
.pk-main b{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-main span{display:block;font-size:9.5px;color:#9ba08f;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-side{display:flex;align-items:center;gap:6px;flex:none}
.pk-side em{font-style:normal;font-size:9px;color:#a4a89a;white-space:nowrap}
.pk-side .pk-subj{color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);border:1px solid color-mix(in srgb,var(--c) 22%,#fff);padding:1px 6px;border-radius:20px;font-weight:600}
.pick-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:44px 20px;color:#b1b4a7;text-align:center}
.pick-empty b{font-size:12px;color:#8b9083}
.pick-empty span{font-size:10px}
.batch-panel{margin:2px 20px 8px;border:1px solid #e2e5dc;background:#f7faf7;border-radius:12px;padding:12px;flex:none}
.bp-head{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:650;color:#3f554a;margin-bottom:9px}
.bp-head span{color:var(--brand);font-size:10px}
.bp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.bp-grid .f{min-width:0}
.bp-grid label{display:block;font-size:9px;color:#a4a89a;margin-bottom:3px;letter-spacing:.03em}
.bp-grid .select,.bp-grid .input{padding:7px 8px;font-size:10.5px}
.bp-actions{display:flex;align-items:center;gap:8px;margin-top:9px}
.danger-link{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--danger)}
.danger-link:hover{text-decoration:underline}
.pick-paper{display:flex;align-items:center;gap:10px;margin:0 20px 10px;padding:9px 11px;border:1px solid #e8e5da;border-radius:10px;background:#fff;flex:none;flex-wrap:wrap}
.pp-title{display:flex;align-items:center;gap:7px;flex:1;min-width:180px}
.pp-title label{font-size:9.5px;color:#9ba08f;white-space:nowrap}
.pp-title .input{padding:6px 9px;font-size:11px;height:31px}
.pp-check{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#6e756a;white-space:nowrap}
.pp-check input{width:13px;height:13px;accent-color:var(--brand)}
.pp-tip{font-size:9px;color:#b1b4a7;white-space:nowrap}
.pick-foot{display:flex;align-items:center;gap:10px;padding:11px 20px;border-top:1px solid #eae7dd;background:#fff;flex:none;flex-wrap:wrap}
.pick-sel{font-size:10.5px;color:var(--brand);font-weight:600}
.link-btn{font-size:10px;color:#7c8294;text-decoration:underline;text-underline-offset:2px}
.link-btn:hover{color:var(--brand)}
.spacer{flex:1}

/* ============================================================
   错题重组卷 / 打印
   ============================================================ */
.paper-modal{
  width:min(1000px,100%);height:calc(100vh - 48px);
  display:flex;flex-direction:column;overflow:hidden;border-radius:18px;
  background:#efece3;box-shadow:0 30px 80px rgba(15,25,20,.3);
}
.paper-toolbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid #e8e5da;flex:none;flex-wrap:wrap}
.pt-left{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#6e756a}
.pt-left b{font-size:12.5px;color:var(--ink)}
.pt-left span{font-size:10px;color:#a4a89a}
.pt-check{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#6e756a}
.pt-check input{width:13px;height:13px;accent-color:var(--brand)}
.paper-scroll{flex:1;overflow:auto;padding:22px;background:#e9e6dc}
.paper-sheet{width:760px;margin:0 auto;background:#fff;padding:46px 52px;box-shadow:0 8px 40px rgba(0,0,0,.12);font-family:var(--serif);color:#1a1a1a}
.ps-head{text-align:left}
.ps-kicker{font-size:11px;letter-spacing:.24em;color:#8a8f86}
.ps-head h1{font-size:26px;text-align:center;margin:6px 0 14px;letter-spacing:.08em;font-weight:600}
.ps-meta{display:flex;flex-wrap:wrap;gap:6px 26px;font-size:12px;border-top:1px solid #ddd;border-bottom:1px solid #ddd;padding:9px 0;margin-bottom:10px}
.ps-meta i{display:inline-block;width:88px;border-bottom:1px solid #999}
.ps-note{font-size:11px;color:#666;line-height:1.7}
.paper-sec{margin-top:20px}
.paper-sec h3{font-size:14px;margin:0 0 10px;padding-bottom:5px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:7px;font-weight:600}
.psec-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.pq{display:flex;gap:8px;margin-bottom:14px;break-inside:avoid}
.pq-no{font-size:13px;font-weight:700;min-width:20px}
.pq-body{flex:1;min-width:0}
.pq-text{font-size:13.5px;line-height:1.9;white-space:normal}
.pq-space{margin-top:8px;height:74px;background:repeating-linear-gradient(#fff 0 27px,#ececec 27px 28px)}
.pq-space.short{height:48px}
.pq-space.tall{height:120px}
.pq-meta{margin-top:5px;font-size:10px;color:#999}
.paper-answers{margin-top:26px;border-top:2px solid #333;padding-top:14px;break-before:page}
.paper-answers h2{font-size:17px;margin:0 0 12px}
.pa-item{margin-bottom:12px;font-size:12.5px;line-height:1.8;break-inside:avoid}
.pa-item p{margin:3px 0}
.pa-item span{font-size:10.5px;color:#8a7a55}
.ps-foot{margin-top:26px;padding-top:10px;border-top:1px solid #ddd;font-size:10px;color:#999;text-align:center}

@media (max-width:760px){
  .overlay{padding:12px}
  .pick-modal,.paper-modal{height:calc(100vh - 24px);border-radius:16px}
  .pick-filters{grid-template-columns:1fr 1fr;padding:10px 14px}
  .pick-list{padding:8px 14px 4px}
  .pick-quick{padding:8px 14px 0}
  .pk-tip{display:none}
  .pick-paper{margin:0 14px 8px}
  .pp-tip{display:none}
  .batch-panel{margin:2px 14px 8px}
  .pick-foot{padding:10px 14px}
  .pk-side em:nth-child(2),.pk-side em:nth-child(3){display:none}
  .paper-scroll{padding:12px}
  .paper-sheet{width:100%;padding:26px 20px}
  .ps-head h1{font-size:20px}
  .ps-meta{gap:5px 14px;font-size:10.5px}
  .ps-meta i{width:58px}
  .pq-text{font-size:12.5px}
  .paper-toolbar{padding:8px 12px;gap:7px}
  .pt-left span{display:none}
}
@media (max-width:420px){
  .pick-filters{grid-template-columns:1fr}
  .pk-search{display:none}
  .paper-toolbar .btn{padding:6px 9px;font-size:10.5px}
  .modal-foot{padding:10px 12px;gap:7px}
  .modal-foot .left-note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9.5px;max-width:38%}
  .modal-foot .left-note svg{display:none}
  .modal-foot .btn{padding:8px 11px;font-size:11.5px;white-space:nowrap}
}

/* ============================================================
   打印：只输出试卷
   ============================================================ */
@media print{
  html,body{background:#fff!important;height:auto!important}
  body > header,
  .app,
  .drawer,
  .drawer-overlay,
  .fab-upload,
  .toast-wrap,
  .overlay:not(#paperOverlay){display:none!important}
  #paperOverlay{
    position:static!important;display:block!important;opacity:1!important;
    background:#fff!important;padding:0!important;overflow:visible!important;
    backdrop-filter:none!important;
  }
  #paperOverlay .paper-modal{
    width:100%!important;max-width:100%!important;height:auto!important;max-height:none!important;
    display:block!important;overflow:visible!important;border-radius:0!important;box-shadow:none!important;background:#fff!important;
  }
  #paperOverlay .paper-toolbar{display:none!important}
  #paperOverlay .paper-scroll{padding:0!important;background:#fff!important;overflow:visible!important}
  #paperOverlay .paper-sheet{
    width:auto!important;max-width:none!important;margin:0!important;padding:0!important;
    box-shadow:none!important;background:#fff!important;
  }
  .pq,.pa-item{break-inside:avoid}
  .paper-sec{break-inside:auto}
  .paper-answers{break-before:page}
  @page{size:A4;margin:16mm 14mm}
}

/* 把「册次 → 章节 → 知识点」的原始目录编译成可检索结构 */
function buildCatalog(raw){
  const src=raw&&raw.subjects?raw.subjects:(raw||{});
  const out={};
  Object.keys(src).forEach(s=>{
    const sub=src[s]||{}, books=[], chapterMap={}, chapters={};
    (sub.books||[]).forEach((b,bi)=>{
      const book={id:'b'+(bi+1),name:b[0],chapters:[]};
      (b[1]||[]).forEach((c,ci)=>{
        const name=c[0];
        if(chapterMap[name]) return;
        const pts=(c[1]||[]).map((p,pi)=>({id:'p'+(pi+1),name:p}));
        const ch={id:'c'+(ci+1),name,points:pts};
        book.chapters.push(ch);
        chapterMap[name]={id:ch.id,book:book.name,bookId:book.id,points:pts.map(p=>p.name)};
        chapters[name]=pts.map(p=>p.name);
      });
      books.push(book);
    });
    out[s]={color:sub.color||'#7c8294',books,chapterMap,chapters};
  });
  return out;
}

function catalogStats(subject){
  const books=catalogBooks(subject);
  let chapters=0,points=0;
  books.forEach(b=>b.chapters.forEach(c=>{chapters++;points+=c.points.length;}));

}

    const hit=bk.chapters.find(ch=>ch.name===c);
    if(hit){ book=bk; chapter=hit; break; }
  }
  if(!chapter){
    if(!b) b=books[0].name;
    if(!book){ book={name:b,chapters:[]}; books.push(book); }
    if(!pts.length) return {error:'新章节至少填写一个知识点'};
    chapter={name:c,points:[]};
    book.chapters.push(chapter);
  }
  if(!pts.length) return {nochange:true,book:book.name,chapter:chapter.name};
  let added=0;
  pts.forEach(p=>{ if(!chapter.points.includes(p)){ chapter.points.push(p); added++; } });
  if(!added) return {nochange:true,book:book.name,chapter:chapter.name};
  rebuildImported(s,books,'校本目录（增补）');
  return {ok:true,book:book.name,chapter:chapter.name,added,total:chapter.points.length};
}
function normCatText(t){
  return String(t||'').toLowerCase().replace(/[\s·、，,。;；:：()（）《》〈〉「」【】“”"'’‘\-—_\/\\|+＋]/g,'');
}
function guessChapter(subject,chapter,point){
  const cat=curric()[subject];
  if(!cat) return null;
  const chs=Object.keys(cat.chapters||{});
  if(chapter&&cat.chapters[chapter]) return {chapter,by:'exact'};
  if(point){
    const byPoint=chs.find(c=>(cat.chapters[c]||[]).includes(point));
    if(byPoint) return {chapter:byPoint,by:'point'};
  }
  const hint=(LEGACY_HINTS[subject]||{})[chapter];
  if(hint&&cat.chapters[hint]) return {chapter:hint,by:'hint'};
  const n=normCatText(chapter);
  if(n.length>=3){
    let best='';
    chs.forEach(c=>{
      const nc=normCatText(c);
      if(nc===n) best=c;
      else if(!best&&Math.min(nc.length,n.length)>=3&&(nc.includes(n)||n.includes(nc))) best=c;
    });
    if(best) return {chapter:best,by:'fuzzy'};
  }
  return null;
}
function migrateItemCategories(){
  let changed=0;
  state.items.forEach(it=>{
    if(!it||!it.subject) return;
    const cat=curric()[it.subject];
    if(!cat) return;
    if(it.chapter===LEGACY_CHAPTER) return;
    if(it.chapter&&cat.chapters[it.chapter]){
      if(it.point&&!(cat.chapters[it.chapter]||[]).includes(it.point)&&!it.needsReview){ it.needsReview=true; changed++; }
      return;
    }
    const found=guessChapter(it.subject,it.chapter,it.point);
    if(found){
      it.legacyChapter=it.legacyChapter||it.chapter||'';
      it.chapter=found.chapter;
      if(it.point&&!(cat.chapters[found.chapter]||[]).includes(it.point)) it.needsReview=true;
      changed++;
    } else {
      it.legacyChapter=it.chapter||it.legacyChapter||'未分类';
      it.chapter=LEGACY_CHAPTER;
      it.needsReview=true;
      changed++;
    }
  });
  return changed;
}
function retryLegacyItems(subject){
  let moved=0;
  const cat=curric()[subject];
  if(!cat) return 0;
  state.items.forEach(it=>{
    if(it.subject!==subject) return;
    if(it.chapter&&cat.chapters[it.chapter]){
      if(it.point&&(cat.chapters[it.chapter]||[]).includes(it.point)&&it.needsReview){ it.needsReview=false; moved++; }
      return;
    }
    const oldLabel=it.chapter===LEGACY_CHAPTER?(it.legacyChapter||''):(it.chapter||'');
    const found=guessChapter(subject,oldLabel,it.point);
    if(found){
      if(oldLabel) it.legacyChapter=oldLabel;
      it.chapter=found.chapter;
      it.needsReview=!!(it.point&&!(cat.chapters[found.chapter]||[]).includes(it.point));
      moved++;
    } else if(oldLabel){
      it.legacyChapter=oldLabel;
      it.chapter=LEGACY_CHAPTER;
      it.needsReview=true;
    }
  });
  return moved;
}
function legacyChapters(subject){
  const cat=curric()[subject]&&curric()[subject].chapters||{};
  const out=[];
  state.items.filter(i=>i.subject===subject).forEach(i=>{
    if(!i.chapter) return;
    const label=i.chapter===LEGACY_CHAPTER?(i.legacyChapter||LEGACY_CHAPTER):(cat[i.chapter]?'':i.chapter);
    if(label&&!out.includes(label)) out.push(label);
  });
  return out;
}
/* 旧分类题目的章节匹配：既匹配目录章节，也匹配「原有分类（待整理）」下的原分类名 */
function chapterMatch(it,chapter){
  if(!chapter) return true;
  if(it.chapter===chapter) return true;
  return it.chapter===LEGACY_CHAPTER&&(it.legacyChapter||'')===chapter;
}
function itemChapterLabel(it){
  return it.chapter===LEGACY_CHAPTER?(it.legacyChapter||LEGACY_CHAPTER):(it.chapter||'');
}

/* ---------------- 原图仓库：IndexedDB（大图不进 localStorage） ---------------- */
const ASSET_DB='jiuke_assets_v1', ASSET_STORE='images';
let assetDbP=null, imageUrls=[];
function assetDb(){
  if(assetDbP) return assetDbP;
  assetDbP=new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('浏览器不支持本地原图仓库')); return; }
    const req=indexedDB.open(ASSET_DB,1);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(ASSET_STORE)) db.createObjectStore(ASSET_STORE,{keyPath:'id'});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('原图仓库打开失败'));
  });
  return assetDbP;
}
async function assetPut(rec){
  const db=await assetDb();
  return new Promise((res,rej)=>{
    const tx=db.transaction(ASSET_STORE,'readwrite');
    tx.objectStore(ASSET_STORE).put(rec);
    tx.oncomplete=()=>res(rec);
    tx.onerror=()=>rej(tx.error);
  });
}
async function assetGet(id){
  const db=await assetDb();
  return new Promise((res,rej)=>{
    const tx=db.transaction(ASSET_STORE,'readonly');
    const rq=tx.objectStore(ASSET_STORE).get(id);
    rq.onsuccess=()=>res(rq.result||null);
    rq.onerror=()=>rej(rq.error);
  });
}
async function assetDel(id){
  try{
    const db=await assetDb();
    await new Promise((res,rej)=>{
      const tx=db.transaction(ASSET_STORE,'readwrite');
      tx.objectStore(ASSET_STORE).delete(id);
      tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
    });
  }catch(e){}
}
function dataURLToBlob(u){
  try{
    const s=String(u||'');
    const comma=s.indexOf(',');
    if(comma<0) return null;
    const head=s.slice(0,comma), b64=s.slice(comma+1);
    const mime=(head.match(/data:([^;]+)/)||[])[1]||'image/jpeg';
    const bin=atob(b64);
    const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return new Blob([arr],{type:mime});
  }catch(e){ return null; }
}
/* 同一张图片可能被拆成多道题共用；只有没有任何错题再引用时才真正删除 */
function attachmentIsUsed(id){
  if(!id) return false;
  return state.items.some(it=>(it.attachments||[]).some(a=>a&&a.id===id));
}
async function releaseAttachments(ids){
  for(const id of new Set((ids||[]).filter(Boolean))){
    if(attachmentIsUsed(id)) continue;
    await assetDel(id);
  }
}
/* 删除后留出撤销窗口：原图延后清理，若期间撤销，因仍被引用会自动跳过删除 */
const UNDO_MS=10000;
function scheduleRelease(ids){
  const list=[...(new Set((ids||[]).filter(Boolean)))];
  if(!list.length) return;
  setTimeout(()=>{ releaseAttachments(list); }, UNDO_MS+800);
}
/* 启动时清理历史孤儿原图：只删「无人引用且超过 1 小时」的记录，避免误删刚上传的草稿图 */
async function gcAssets(){
  try{
    const db=await assetDb();
    const recs=await new Promise((res,rej)=>{
      const tx=db.transaction(ASSET_STORE,'readonly');
      const rq=tx.objectStore(ASSET_STORE).getAll();
      rq.onsuccess=()=>res(rq.result||[]);
      rq.onerror=()=>rej(rq.error);
    });
    const keep=new Set(state.items.flatMap(i=>(i.attachments||[]).map(a=>a&&a.id)).filter(Boolean));
    const limit=Date.now()-3600*1000;
    for(const r of recs){
      if(!r||!r.id||keep.has(r.id)) continue;
      const t=Date.parse(r.createdAt||'')||0;
      if(t&&t<limit) await assetDel(r.id);
    }
  }catch(e){}
}
async function persistAttachment(r){
  const file=r._file;
  if(!file && !r.preview) return null;
  const id='att_'+uid();

  return { id, name:rec.name, type:rec.mime, size:rec.size, width:rec.width, height:rec.height, cropped:rec.cropped, thumb:rec.thumb, createdAt:rec.createdAt };
}

/* ---------------- 本地 OCR 识别服务 ---------------- */
const OCR_DEFAULT='http://127.0.0.1:8765';
let ocrStatus={state:'unknown',engine:'',error:'',at:0,checking:false};
function ocrBase(){
  const u=(state.ocr&&state.ocr.url)||OCR_DEFAULT;
  return String(u).trim().replace(/\/+$/,'')||OCR_DEFAULT;
}
// 线上 HTTPS 页面无法直接访问本机回环地址（浏览器私有网络限制），提前识别，避免无意义的连接报错
function ocrLoopbackBlocked(){
  try{
    const u=new URL(ocrBase());
    const loop=/^(127\.0\.0\.1|localhost|\[::1\]|::1)$/i.test(u.hostname);
    return location.protocol==='https:'&&loop;
  }catch(e){ return false; }
}
function ocrStateText(){
  if(ocrStatus.checking) return {t:'检测中…',cls:'checking'};
  if(ocrStatus.state==='online') return {t:'识别服务已连接',cls:'online'};
  if(ocrStatus.blocked) return {t:'线上版：图片识别请用本机版',cls:'offline'};
  if(ocrStatus.state==='offline') return {t:'演示识别（未连接服务）',cls:'offline'};
  return {t:'识别服务待检测',cls:'unknown'};
}
async function checkOcr(force){
  if(ocrStatus.checking) return ocrStatus;
  const prev=ocrStatus.state;
  if(ocrLoopbackBlocked()){
    ocrStatus={state:'offline',blocked:true,engine:'',error:'线上分享版不能直连本机识别服务；图片识别请在本机打开原版，或先上传文字 / 文档',at:Date.now(),checking:false};
    updateOcrUI();
    return ocrStatus;
  }
  ocrStatus={...ocrStatus,checking:true};
  updateOcrUI();
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),2600);
  try{
    const res=await fetch(ocrBase()+'/health',{signal:ctrl.signal,cache:'no-store'});
    const j=await res.json();
    ocrStatus={state:j.ok?'online':'offline',engine:j.engine||'',error:j.error||'',at:Date.now(),checking:false};
  }catch(e){
    ocrStatus={state:'offline',engine:'',error:(e&&e.name==='AbortError')?'连接超时':(e&&e.message)||'无法连接',at:Date.now(),checking:false};
  }
  clearTimeout(timer);
  updateOcrUI();
  if(force&&prev!=='online'&&ocrStatus.state==='online') toast('本地识别服务已连接，图片将使用真实 OCR');
  return ocrStatus;
}
async function ocrImage(file){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),60000);
  try{
    const ctype=/pdf$/i.test(file.name||'')?'application/pdf':(file.type||'image/jpeg');
    const res=await fetch(ocrBase()+'/ocr',{method:'POST',headers:{'Content-Type':ctype},body:file,signal:ctrl.signal});
    const j=await res.json();
    if(!res.ok||!j.ok) throw new Error(j.error||('识别服务返回 '+res.status));
    return j;
  }catch(e){
    if(e&&e.name==='AbortError') throw new Error('识别超时，请换一张更清晰的照片');
    throw e;
  }finally{ clearTimeout(timer); }
}
function ocrQuality(j){
  const text=(j&&j.text)||'', n=(j&&j.lines||[]).length;
  if(text.length>=60&&n>=3) return {label:'良好',conf:92};
  if(text.length>=20) return {label:'可校对',conf:82};
  if(text.length>0) return {label:'内容偏少',conf:64};
  return {label:'未识别到文字',conf:0};
}
function updateOcrUI(){
  const st=ocrStateText();
  document.querySelectorAll('[data-ocr-pill]').forEach(el=>{
    el.className='ocr-pill '+st.cls;
    el.innerHTML=`<span class="dot"></span><span>${st.t}</span>`;
  });
  document.querySelectorAll('[data-ocr-state]').forEach(el=>{ el.textContent=st.t; el.className='ocr-state '+st.cls; });
}

async function saveOcrUrl(){
  const inp=$('#ocrUrl');
  const v=inp?inp.value.trim():'';
  if(v&&!/^https?:\/\//i.test(v)){ toast('地址需要以 http:// 或 https:// 开头',false); return; }
  state.ocr.url=v||OCR_DEFAULT; save();
  if(ocrLoopbackBlocked()){
    await checkOcr(true); renderOcrModal();
    toast('线上分享版不能连接本机识别服务，请用本机原版',false);
    return;
  }
  const btn=document.querySelector('#ocrModal [data-act="saveOcr"]');
  if(btn){ btn.disabled=true; btn.textContent='正在检测…'; }
  await checkOcr(true);
  renderOcrModal();
  if(ocrStatus.state==='online') toast('识别服务已连接'); else toast('没有连上，可稍后重试',false);
}
function subjColor(s){ return (CURRICULUM[s]||{}).c || '#7c8294'; }

function allPoints(subject){ const arr=[]; const ch=curric()[subject]?.chapters||{}; for(const c in ch) ch[c].forEach(p=>arr.push([c,p])); return arr; }
function subjectOfPoint(subject, point){ for(const c in curric()[subject].chapters){ if(curric()[subject].chapters[c].includes(point)) return c; } return ''; }
function catalogEditionLabel(subject){
  if(subject==='数学') return '人教A版';
  if(['语文','政治','历史'].includes(subject)) return '统编版';
  return '人教版';
}
function editionList(subject){
  const cat=currentCatalog(subject)||CATALOG_BASE[subject];
  const isImported=!!(state.catalogImport&&state.catalogImport[subject]);
  return [{id:isImported?'school':'builtin',
    name:isImported?(cat.name||'校本目录'):'人教版 / 统编版（完整目录）',

}
function currentEdition(subject){ return editionList(subject)[0]; }

function chapterOptionsHTML(subject,selected){

  }).join('');
}
function pointOptionsHTML(subject,chapter,selected){

  return pts.map(p=>`<option value="${esc(p)}" ${p===selected?'selected':''}>${esc(p)}</option>`).join('');
}
function reasonGroups(){
  const custom=(state.customTags||[]).filter(Boolean);
  return custom.length?[...REASON_GROUPS,{name:'自定义',color:'#7c8294',tags:custom}]:REASON_GROUPS;
}
function allReasons(){
  return [...new Set(reasonGroups().flatMap(g=>g.tags))];
}
function reasonGroupName(tag){
  for(const g of reasonGroups()) if(g.tags.includes(tag)) return g.name;
  return '其他';
}
function reasonStats(){
  const map={};
  state.items.forEach(i=>{
    const list=(i.reasons&&i.reasons.length?i.reasons:String(i.reason||'').split(/[、,，]/)).filter(Boolean);
    list.forEach(r=>map[r]=(map[r]||0)+1);
  });
  const groups={};
  reasonGroups().forEach(g=>groups[g.name]=0);
  groups['其他']=groups['其他']||0;
  Object.entries(map).forEach(([r,n])=>{ const g=reasonGroupName(r); groups[g]=(groups[g]||0)+n; });
  return {tags:Object.entries(map).sort((a,b)=>b[1]-a[1]),groups};
}
function dayKey(d){
  const x=new Date(d);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
}
function lastDays(n){
  const out=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    out.push(d);
  }
  return out;
}
function masteryPct(items){ if(!items.length) return 0; return Math.round(items.reduce((a,b)=>a+(b.mastery||0),0)/(items.length*2)*100); }
function masteryLabel(p){ return p>=80?'已掌握':p>=45?'复习中':'待巩固'; }
function daysBetween(a,b){ return Math.floor((new Date(b)-new Date(a))/86400000); }
function isDue(it){
  if((it.mastery||0)>=2) return false;
  if(!it.lastReview) return true;
  const gap = (it.mastery||0)===0?1:3;
  return daysBetween(it.lastReview, nowISO()) >= gap;
}
function dueItems(){ return state.items.filter(isDue).sort((a,b)=>new Date(a.lastReview||0)-new Date(b.lastReview||0)); }
function relTime(isoStr){
  const d = Math.max(0, daysBetween(isoStr, nowISO()));
  if(d===0) return '今天';
  if(d===1) return '昨天';
  if(d<7) return d+' 天前';
  if(d<30) return Math.floor(d/7)+' 周前';
  return Math.floor(d/30)+' 个月前';
}

function toast(msg, ok, act){
  const el = document.createElement('div');
  el.className='toast'+(act?' act':'');
  el.innerHTML = (ok===false?'':icon('check',14))+`<span>${esc(msg)}</span>`+(act?`<button class="toast-act" type="button">${esc(act.label)}</button>`:'');
  $('#toasts').appendChild(el);
  let closed=false;
  const close=()=>{
    if(closed) return;
    closed=true;
    el.style.transition='opacity .25s,transform .25s';
    el.style.opacity='0'; el.style.transform='translateY(6px)';
    setTimeout(()=>el.remove(),300);
  };
  if(act){
    const btn=el.querySelector('.toast-act');
    if(btn) btn.addEventListener('click',()=>{ try{ act.fn&&act.fn(); }catch(e){ console.warn(e); } close(); });
    setTimeout(close, act.ms||10000);
  } else {
    setTimeout(close, 2400);
  }
}

function hl(text){
  const q=ui.query.trim(); const safe=esc(text);
  if(!q) return safe;
  try{
    const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    return safe.replace(re,'<mark>$1</mark>');
  }catch(e){ return safe; }
}

/* ---------------- weekly report ---------------- */
function reportData(){
  const days=lastDays(7), keys=days.map(dayKey);
  const newMap={}, revMap={};
  keys.forEach(k=>{ newMap[k]=0; revMap[k]=0; });
  state.items.forEach(i=>{ const k=dayKey(i.createdAt); if(k in newMap) newMap[k]++; });
  const logs=(state.reviewLog||[]).filter(l=>l&&l.at);
  logs.forEach(l=>{ const k=dayKey(l.at); if(k in revMap) revMap[k]++; });
  const weekItems=state.items.filter(i=>keys.includes(dayKey(i.createdAt)));
  const weekLogs=logs.filter(l=>keys.includes(dayKey(l.at)));
  const deltaPct=Math.round(weekLogs.reduce((a,b)=>a+(b.delta||0),0)/Math.max(1,state.items.length*2)*100);
  const activeDays=new Set([...weekLogs.map(l=>dayKey(l.at)),...weekItems.map(i=>dayKey(i.createdAt))]).size;
  const pct=masteryPct(state.items);
  const due=dueItems();
  const reasons=reasonStats();
  const wm={};
  state.items.forEach(i=>{
    const k=i.subject+'|'+itemChapterLabel(i)+'|'+i.point;
    if(!wm[k]) wm[k]={subject:i.subject,chapter:itemChapterLabel(i),point:i.point,count:0,mastery:0,due:0};
    wm[k].count++; wm[k].mastery+=(i.mastery||0); if(isDue(i)) wm[k].due++;
  });
  const weak=Object.values(wm).map(x=>({...x,avg:x.mastery/x.count,score:x.count*2+(2-x.mastery/x.count)*3+x.due*1.5}))
    .sort((a,b)=>b.score-a.score).slice(0,5);
  const dist=SUBJECTS.map(s=>{
    const its=state.items.filter(i=>i.subject===s);
    return {subject:s,n:its.length,pct:masteryPct(its),color:subjColor(s)};
  });
  return {days,keys,newMap,revMap,weekItems,weekLogs,deltaPct,activeDays,pct,due,reasons,weak,dist};
}

function ringSVG(pct,size,stroke,color,track){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c-(Math.min(100,Math.max(0,pct))/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg>`;
}

function noteKey(p){ return p.subject+'|'+p.chapter+'|'+p.point; }
function getNote(s,c,p){
  const k=s+'|'+c+'|'+p;
  if(state.notes[k]) return state.notes[k];
  const its=state.items.filter(i=>i.subject===s&&i.chapter===c&&i.point===p);
  const reasons=[...new Set(its.map(i=>i.reason).filter(Boolean))];
  return `【考查核心】${p}\n【常见失分】${reasons.join('、')||'尚未归纳，建议补充典型错因。'}\n【复习建议】先回顾教材中的定义与例题，再重做本题；24 小时后用同类变式自测，确认能否独立完成。`;

function similarItems(item){
  const base=item||{};
  const sharedCount=(a,b)=>{
    const A=new Set([...(a.tags||[]),...(a.reasons||[])].filter(Boolean));
    const B=new Set([...(b.tags||[]),...(b.reasons||[])].filter(Boolean));
    let n=0; A.forEach(x=>{ if(B.has(x)) n++; });
    return n;
  };
  return state.items
    .filter(i=>i.id!==base.id)
    .map(i=>{
      let score=0, rel='';
      if(i.subject===base.subject&&i.chapter===base.chapter&&i.point===base.point){ score+=10; rel='同知识点'; }
      else if(i.subject===base.subject&&i.chapter===base.chapter){ score+=6; rel='同章节'; }
      else if(i.subject===base.subject){ score+=2; rel='同科目'; }
      const sh=sharedCount(base,i);
      score+=sh*1.5;
      return {...i,rel,score,shared:sh};
    })
    .filter(x=>x.rel==='同知识点'||x.rel==='同章节'||x.shared>0)
    .sort((a,b)=>b.score-a.score)
    .slice(0,4);
}
function similarSectionHTML(its,s,c,p){
  const base=its[0]||{subject:s,chapter:c,point:p,id:'',tags:[],reasons:[]};
  const sims=similarItems(base).filter(x=>!(x.subject===s&&x.chapter===c&&x.point===p));
  const cards=sims.map(x=>`<button class="sim-card" data-act="point" data-subject="${x.subject}" data-chapter="${esc(x.chapter)}" data-point="${esc(x.point)}">
      <span class="sc-ic">${icon('target',12)}</span>
      <span class="sc-main"><b>${esc(x.title)}</b><span>${x.rel}${x.shared?` · 共同错因 ${x.shared} 个`:''} · ${x.subject} · ${esc(x.point)}</span></span>
      <span class="sc-go">${icon('chevron',12)}</span>
    </button>`).join('');
  return `<div class="detail-section-title" style="margin-top:16px">举一反三 <span>从知识库中找同类错题</span></div>
    <div class="sim-list">${cards||'<div class="chapter-empty">这个知识点暂时没有其他同类错题，后续上传会自动聚合。</div>'}</div>
    <div class="sim-actions">
      <button class="btn primary sm" data-act="reviewPoint" data-subject="${s}" data-chapter="${esc(c)}" data-point="${esc(p)}">${icon('target',13)}同知识点复习（${its.length}）</button>

function toggleStar(id){
  const it=state.items.find(i=>i.id===id); if(!it) return;
  it.starred=!it.starred; it.updatedAt=nowISO(); save();
  if(ui.filter==='star'||ui.view!=='kb') renderAll(); else { renderCenter(); renderRight(); }
  if(currentPoint) renderDrawer();
  toast(it.starred?'已加入星标':'已取消星标');
}
async function delItem(id){
  const it=state.items.find(i=>i.id===id); if(!it) return;
  if(!confirm(`确定删除「${it.title}」吗？删除后 ${UNDO_MS/1000} 秒内可在提示条上撤销。`)) return;
  const snap=JSON.parse(JSON.stringify(it));
  const atts=it.attachments||[];
  state.items=state.items.filter(i=>i.id!==id); save();
  renderAll(); if(currentPoint) renderDrawer();
  scheduleRelease(atts.map(a=>a&&a.id));
  toast('错题已删除', true, {label:'撤销', fn:()=>{
    if(state.items.some(x=>x.id===snap.id)) return;
    state.items.push(snap); save();
    renderAll(); if(currentPoint) renderDrawer();
    toast('已恢复该错题');
  }});
}

function saveItem(){
  if(!editDraft) return;
  readEditForm();
  const d=editDraft;
  d.title=String(d.title||'').trim()||'未命名错题';
  d.question=String(d.question||'').trim();
  d.answer=String(d.answer||'').trim();
  d.reasons=(d.reasons||[]).filter(Boolean);
  if(!d.reasons.length) d.reasons=['知识点掌握不牢'];
  d.reason=d.reasons.join('、');
  d.difficulty=d.difficulty||'中';
  d.source=String(d.source||'').trim();
  d.tags=(d.tags||[]).map(x=>String(x).trim()).filter(Boolean);
  d.updatedAt=nowISO();
  const catPoints=(curric()[d.subject]&&curric()[d.subject].chapters[d.chapter])||null;
  if(catPoints&&catPoints.includes(d.point)) d.needsReview=false;
  const removed=d._removedAtts||[];
  delete d._removedAtts;
  const idx=state.items.findIndex(i=>i.id===d.id);
  if(idx>=0) state.items[idx]=d;
  save(); closeEdit(); renderAll();
  releaseAttachments(removed);
  if(currentPoint) renderDrawer();
  toast('修改已保存');
}

function fileChip(f,i){
  const ext=(f.name.split('.').pop()||'').toUpperCase();
  const meta=f.meta||{};
  const img=isImageFile(f);
  const useCrop=img&&upload&&upload.autoCrop!==false&&!!meta.cropUrl;
  const thumb=useCrop?meta.cropUrl:(img?(meta.originalUrl||meta.thumb):'');
  const flags=[];
  if(meta.analyzing) flags.push('<em>分析中…</em>');
  if(meta.width) flags.push(`<em>${meta.width}×${meta.height}</em>`);
  if(meta.blurry) flags.push('<em class="warn">可能模糊，建议重拍</em>');
  if(useCrop) flags.push('<em class="ok">已自动裁边</em>');
  if(meta.error) flags.push('<em class="warn">无法预览</em>');
  const ic=img?(meta.error?'doc':'camera'):'doc';
  return `<div class="file-chip ${meta.blurry?'blurry':''}">
    ${thumb?`<span class="thumb"><img src="${thumb}" alt=""></span>`:`<span class="fi">${icon(ic,13)}</span>`}
    <span class="fn"><b>${esc(f.name)}</b><span>${ext} · ${fmtSize(f.size)}</span><span class="flags">${flags.join('')}</span></span>
    <button class="rm" data-rm="${i}" title="移除">${icon('close',12)}</button>
  </div>`;
}
function fmtSize(n){ if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(0)+' KB'; return (n/1048576).toFixed(1)+' MB'; }
function addFiles(list){
  if(!upload||!list) return;
  [...list].slice(0,9-upload.files.length).forEach(f=>upload.files.push({file:f,name:f.name,size:f.size,type:f.type,meta:null}));
  renderUpload();
  prepareUploadFiles(upload);
}

/* -------- image analysis: thumbnail, crop, blur estimate -------- */
function isImageFile(f){
  return /^image\//i.test((f&&f.type)||'') || /\.(jpe?g|png|webp|bmp|gif|heic|heif)$/i.test((f&&f.name)||'');
}
function loadImageEl(src){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>res(im);
    im.onerror=()=>rej(new Error('image load failed'));
    im.src=src;
  });
}
function canvasThumb(img,sx,sy,sw,sh,maxW){
  const scale=Math.min(1,maxW/sw);
  const cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(sw*scale));
  cv.height=Math.max(1,Math.round(sh*scale));
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(img,sx,sy,sw,sh,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',0.82);
}
async function analyzeImageFile(file){
  const originalUrl=URL.createObjectURL(file);
  const img=await loadImageEl(originalUrl);
  const W=img.naturalWidth||img.width, H=img.naturalHeight||img.height;
  if(!W||!H) throw new Error('bad image size');
  const maxSide=260;
  const sc=Math.min(1,maxSide/Math.max(W,H));
  const w=Math.max(4,Math.round(W*sc)), h=Math.max(4,Math.round(H*sc));
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(img,0,0,w,h);
  const px=ctx.getImageData(0,0,w,h).data;
  const gray=new Float32Array(w*h);
  let mn=255,mx=0;
  for(let i=0;i<w*h;i++){
    const g=0.299*px[i*4]+0.587*px[i*4+1]+0.114*px[i*4+2];
    gray[i]=g; if(g<mn)mn=g; if(g>mx)mx=g;
  }
  /* Laplacian variance as a cheap sharpness proxy */
  let s1=0,s2=0,cnt=0;
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    const i=y*w+x;
    const v=4*gray[i]-gray[i-1]-gray[i+1]-gray[i-w]-gray[i+w];
    s1+=v; s2+=v*v; cnt++;
  }
  const mean=s1/Math.max(1,cnt);
  const sharp=Math.sqrt(Math.max(0,s2/Math.max(1,cnt)-mean*mean));
  /* bright paper region bounding box */
  const thr=Math.max(105, mn+(mx-mn)*0.60);
  let x0=w,y0=h,x1=-1,y1=-1,bright=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(gray[y*w+x]>=thr){ bright++; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  let cropUrl='';
  if(bright>w*h*0.06 && x1>x0 && y1>y0){
    const bw=(x1-x0+1)/w, bh=(y1-y0+1)/h;
    if(bw<0.94||bh<0.94){
      const sx=(x0/w)*W, sy=(y0/h)*H, sw=((x1-x0+1)/w)*W, sh=((y1-y0+1)/h)*H;
      const padX=sw*0.03, padY=sh*0.03;
      const cx=Math.max(0,x0>0?sx-padX:0), cy=Math.max(0,y0>0?sy-padY:0);
      const cw=Math.min(W-cx,sw+padX*2), chh=Math.min(H-cy,sh+padY*2);
      if(cw>20&&chh>20) cropUrl=canvasThumb(img,cx,cy,cw,chh,720);
    }
  }
  const thumb=canvasThumb(img,0,0,W,H,120);
  return {
    originalUrl, cropUrl, thumb,
    width:W, height:H,
    sharpness:Math.round(sharp),
    blurry: sharp<7.5
  };
}
function prepareUploadFiles(u){
  if(!u||!u.files.length) return Promise.resolve();
  const jobs=u.files.filter(f=>isImageFile(f)&&!f.meta).map(async f=>{
    f.meta={analyzing:true};
    try{
      const meta=await analyzeImageFile(f.file);
      f.meta={...meta,analyzing:false};
    }catch(e){
      f.meta={analyzing:false,error:true};
    }
    if(upload===u && u.step===1){
      const body=document.querySelector('#uploadModal .modal-body');
      const top=body?body.scrollTop:0;
      renderUpload();
      const nb=document.querySelector('#uploadModal .modal-body');
      if(nb) nb.scrollTop=top;
    }
  });
  u.imgPromise=Promise.all(jobs);
  return u.imgPromise;
}

async function startProcess(){
  if(!upload) return;
  if(upload.mode==='paste'&&!upload.text.trim()){ toast('请先粘贴题目内容'); return; }
  if(upload.mode!=='paste'&&!upload.files.length){ toast('请先选择文件'); return; }
  const hasImg=upload.files.some(f=>isImageFile(f)||/pdf$/i.test(f.name||''));
  if(hasImg&&ocrStatus.state==='unknown') await checkOcr();
  upload.step=2; renderUpload();
}

async function runProcess(){
  const token=upload.token;
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const imgCount=upload.files.filter(f=>isImageFile(f)||/pdf$/i.test(f.name||'')).length;
  const ocrOn=ocrStatus.state==='online';
  const labels=['读取文件与版面分析',imgCount?(ocrOn?'本地 OCR 文字识别':(ocrStatus.blocked?'演示识别（线上版不支持图片）':'演示识别（未连接服务）')):'正文抽取','切分题目、答案与解析','匹配教材章节与知识点','生成结构化错题卡'];
  const bar=$('#procBar');
  const mark=(i,mode)=>{
    const node=document.querySelector(`.proc-step[data-i="${i}"]`);
    if(!node) return;
    if(mode==='active'){
      node.classList.add('active'); node.classList.remove('done');
      node.querySelector('.ps-ic').innerHTML='<span class="spin"></span>';
      node.querySelector('.ps-time').textContent='进行中';
    }else{
      node.classList.remove('active'); node.classList.add('done');
      node.querySelector('.ps-ic').textContent='✓';
      node.querySelector('.ps-time').textContent='完成';
    }
  };
  const progress=v=>{ if(bar) bar.style.width=Math.round(v)+'%'; };
  if(!upload||upload.token!==token) return;
  mark(0,'active'); progress(6);
  await sleep(360);
  if(!upload||upload.token!==token) return;
  mark(0,'done'); progress(14);
  let results=[];
  mark(1,'active');
  try{ results=await buildResults(); }catch(e){ console.error(e); }
  if(!upload||upload.token!==token) return;
  mark(1,'done'); progress(48);
  for(let i=2;i<labels.length;i++){
    mark(i,'active');
    await sleep(300+Math.random()*180);
    if(!upload||upload.token!==token) return;
    mark(i,'done');
    progress(48+(i-1)/3*44);
  }
  if(!results.length){ closeUpload(); toast('没有识别到有效题目，请换一份资料试试',false); return; }
  detectDuplicates(results);
  upload.results=results.slice(0,20);
  upload.demo=upload.results.some(r=>r.demo);
  upload.demoWhy=(upload.results.find(r=>r.demo)||{}).demoWhy||'';
  progress(100);
  await sleep(220);
  if(!upload||upload.token!==token) return;
  upload.step=3; renderUpload();
}

async function buildResults(){
  const out=[];
  if(upload.mode==='paste'){
    const texts=splitQuestions(upload.text);
    texts.forEach(t=>{ const r=analyzeText(t,'粘贴文本',upload.subject); if(r) out.push(r); });
    return out;
  }
  if(upload.imgPromise){
    try{ await upload.imgPromise; }catch(e){}
  }
  for(const f of upload.files){
    let text='', ocrInfo=null, ocrError='';
    try{ text=await extractText(f.file); }catch(e){}
    const imgLike=isImageFile(f)||/pdf$/i.test(f.name||'');
    if(!text.trim()&&imgLike&&ocrStatus.state==='online'){
      try{
        const j=await ocrImage(f.file);
        text=j.text||'';
        ocrInfo=j;
      }catch(e){ ocrError=(e&&e.message)||'识别服务调用失败'; }
    }
    const guessed=guessSubjectFromName(f.name);
    if(text&&text.trim().length>20){
      const parts=splitQuestions(text);
      const meta=f.meta||{};
      const useCrop=!!(meta.cropUrl&&upload.autoCrop!==false);
      const preview=useCrop?meta.cropUrl:(meta.originalUrl||'');
      (parts.length?parts:[text]).forEach((part,idx)=>{
        if(part.trim().length<8) return;
        const r=analyzeText(part,f.name,upload.subject,ocrInfo);
        if(r){
          r._file=f.file; r._thumbData=(f.meta&&f.meta.thumb)||'';
          r.preview=preview;
          r.cropped=useCrop;
          r.width=meta.width||0; r.height=meta.height||0;
          r.sharpness=meta.sharpness||0; r.blurry=!!meta.blurry;
          r.kind=imgLike?(/pdf$/i.test(f.name||'')?'PDF':'图片'):'文档';
          if(idx>0) r.title=makeTitle(r.question,r.point);
          out.push(r);
        }
      });
    } else {
      const r=demoResult(f,upload.subject||guessed);
      r._file=f.file; r._thumbData=(f.meta&&f.meta.thumb)||'';
      if(imgLike){
        if(ocrError) r.demoWhy=`本地识别没有成功：${ocrError}。下面是示例题目，可手动改成图片里的内容。`;
        else if(ocrStatus.state==='online') r.demoWhy='这张图没有识别到清晰文字，建议换一张更清楚的照片或手动录入。下面是示例题目。';
        else r.demoWhy='未连接本地 OCR 服务。下面是示例题目，不代表图片真实内容；连接服务后会自动读取图片文字。';
      }
      out.push(r);
    }
  }
  if(upload.subject||upload.presetPoint){
    out.forEach(r=>{
      if(upload.subject){
        r.subject=upload.subject;
        const chs=Object.keys(curric()[r.subject].chapters);
        if(!chs.includes(r.chapter)) r.chapter=upload.presetChapter&&chs.includes(upload.presetChapter)?upload.presetChapter:chs[0];
        const pts=curric()[r.subject].chapters[r.chapter];
        if(!pts.includes(r.point)) r.point=(upload.presetPoint&&pts.includes(upload.presetPoint))?upload.presetPoint:pts[0];
      }
    });
  }
  return out;
}

function splitQuestions(text){
  const clean=text.trim();
  if(!clean) return [];
  let parts=clean.split(/\n(?=\s*\d+[.、．]\s*)/).map(s=>s.trim()).filter(Boolean);
  if(parts.length<=1) parts=clean.split(/\n{2,}/).map(s=>s.trim()).filter(s=>s.length>15);
  if(parts.length>1){
    const first=parts[0];
    const looksLikeQuestion=/[？?]|求|已知|下列|计算|证明|分析|说明|阅读|如图|材料|判断|选择|填空|若|设|解/.test(first);
    if(!looksLikeQuestion&&first.length<80) parts.shift();
  }
  return parts.slice(0,8);
}

async function extractText(file){
  const n=file.name.toLowerCase();
  if(/\.(txt|md|csv|json)$/.test(n)) return await file.text();
  if(/\.docx$/.test(n)) return await extractDocx(file);
  return '';
}

async function extractDocx(file){
  try{
    const buf=new Uint8Array(await file.arrayBuffer());
    const dv=new DataView(buf.buffer);
    let off=0;
    while(off<buf.length-4){
      if(buf[off]===0x50&&buf[off+1]===0x4b&&buf[off+2]===3&&buf[off+3]===4){
        const method=dv.getUint16(off+8,true);
        const compSize=dv.getUint32(off+18,true);
        const nameLen=dv.getUint16(off+26,true);
        const extraLen=dv.getUint16(off+28,true);
        const name=new TextDecoder().decode(buf.slice(off+30,off+30+nameLen));
        const start=off+30+nameLen+extraLen;
        if(name==='word/document.xml'&&compSize>0){
          let data=buf.slice(start,start+compSize);
          if(method===8){
            const ds=new DecompressionStream('deflate-raw');
            const stream=new Blob([data]).stream().pipeThrough(ds);
            data=new Uint8Array(await new Response(stream).arrayBuffer());
          }
          let xml=new TextDecoder().decode(data);
          xml=xml.replace(/<w:tab\/>/g,'\t').replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'');
          return xml.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/\n{2,}/g,'\n').trim();
        }
        off=start+compSize;
        if(compSize===0) off=start+1;
      } else off++;
    }
  }catch(e){ console.warn('docx parse failed',e); }
  return '';
}

const SUBJECT_KW={
  '语文':['文言','实词','虚词','诗歌','作文','病句','成语','默写','阅读','修辞','红楼梦','散文','小说','论证'],
  '数学':['函数','导数','极值','最值','数列','椭圆','双曲线','抛物线','向量','概率','三角','几何','方程','不等式','集合','复数','排列组合'],
  '英语':['passage','author','grammar','vocabulary','完形','语法','续写','英语','单词','从句','时态'],
  '物理':['加速度','速度','受力','电场','磁场','电流','电压','动量','机械能','斜面','小球','洛伦兹','安培','电磁感应','焦距'],
  '化学':['溶液','电解','电极','ph','氧化','还原','化学平衡','分子','原子','离子','有机物','官能团','沉淀','胶体'],
  '生物':['细胞','光合','呼吸作用','遗传','基因','酶','免疫','种群','生态','激素','突触','染色体','atp'],
  '政治':['政府','公民','哲学','矛盾','文化','市场经济','人民代表大会','政党','价值观','新质生产力','宏观调控'],
  '历史':['朝代','秦朝','汉朝','唐朝','宋朝','明朝','清朝','革命','战争','条约','改革','郡县','长征','工业革命'],
  '地理':['气候','洋流','地形','水循环','人口迁移','城市化','区位','区域','大气环流','副高','生态','流域']
};
function detectSubject(text){
  const t=(text||'').toLowerCase();
  let best='',bs=0;
  for(const s in SUBJECT_KW){
    let sc=0; SUBJECT_KW[s].forEach(k=>{ if(t.includes(k.toLowerCase())) sc++; });
    if(sc>bs){bs=sc;best=s;}
  }
  if(bs>=2) return best;
  const enHits=(t.match(/\b(the|and|passage|author|according|choose|complete|sentence|word|answer|question|paragraph|meaning)\b/g)||[]).length;
  const enRatio=(t.match(/[a-z]/g)||[]).length/Math.max(1,t.length);
  if(enHits>=2||(enRatio>0.62&&enHits>=1)) return '英语';
  if(bs===1) return best;
  return bs>=1?best:'';
}
function guessSubjectFromName(name){
  const t=(name||'').toLowerCase();
  for(const s of SUBJECTS){ if(t.includes(s)) return s; }
  const map={math:'数学',physics:'物理',chemistry:'化学',biology:'生物',chinese:'语文',english:'英语',history:'历史',geography:'地理',politics:'政治'};
  for(const k in map){ if(t.includes(k)) return map[k]; }
  return '';
}
function pointTokens(str){
  const out=new Set();
  str.split(/[·、\s（）()\/\-—,，.。:：]/).filter(Boolean).forEach(p=>{
    if(p.length>=2) out.add(p);
    for(let i=0;i<p.length-1;i++) out.add(p.slice(i,i+2));
  });
  return [...out];
}
function matchPoint(text,subject){
  const t=(text||'').toLowerCase();
  let best={chapter:'',point:'',score:0};
  for(const c in curric()[subject].chapters){
    const chHit=t.includes(c.toLowerCase())?2:0;
    curric()[subject].chapters[c].forEach(p=>{
      let sc=chHit;
      if(t.includes(p.toLowerCase())) sc+=6;
      pointTokens(p).forEach(tok=>{ if(tok.length>=2&&t.includes(tok.toLowerCase())) sc+=0.8; });
      if(sc>best.score) best={chapter:c,point:p,score:sc};
    });
  }
  if(!best.point){ const c=Object.keys(curric()[subject].chapters)[0]; best={chapter:c,point:curric()[subject].chapters[c][0],score:0}; }
  return best;
}
function detectReason(text){
  const t=text||'';
  const rules=[['计算失误',['计算','算错','结果错','粗心']],['审题偏差',['审题','看错','忽略条件','题意']],['概念不清',['概念','定义','混淆','不理解']],['公式误用',['公式','套错']],['分类讨论遗漏',['漏解','分类讨论','没有讨论']],['答题角度不全',['角度','不全面','漏答','不完整']]];
  for(const [r,ks] of rules){ if(ks.some(k=>t.includes(k))) return r; }
  return '知识点掌握不牢';
}
function cleanQuestion(text){
  let t=(text||'').trim();
  const m=t.match(/(【答案】|【解析】|答案[:：]|解析[:：])/);
  if(m&&m.index>10) t=t.slice(0,m.index);
  t=t.replace(/^(姓名|班级|考号|得分)[:：].*$/gm,'').trim();
  t=t.replace(/^\s*\d+[.、．]\s*/,'');
  return t.slice(0,900);
}
function extractAnswer(text){
  const t=(text||'').trim();
  const m=t.match(/(【答案】|答案[:：]|【解析】|解析[:：])/);
  if(m&&m.index>=0){
    let ans=t.slice(m.index).replace(/^(【答案】|答案[:：]|【解析】|解析[:：])/,'').trim();
    ans=ans.split(/\n?\s*(?:【?错因】?|错因分析|易错点|失分点|来源)[:：]?/)[0].trim();
    return ans.slice(0,700);
  }
  return '';
}
function makeTitle(q,point){
  let t=(q||'').replace(/^\s*\d+[.、．]\s*/,'').replace(/\s+/g,' ').trim();
  t=t.split(/[。？！?]/)[0]||point;
  return t.length>34?t.slice(0,34)+'…':t;
}
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
function analyzeText(text,fileName,hint,ocrInfo){
  const subject=hint||detectSubject(text)||'数学';
  const m=matchPoint(text,subject);
  const q=cleanQuestion(text);
  const ans=extractAnswer(text);
  const quality=ocrInfo?ocrQuality(ocrInfo):null;
  const confidence=quality?quality.conf:Math.min(96,72+Math.round(m.score*2.2)+(hint?5:0));
  return {
    subject, chapter:m.chapter, point:m.point,
    title:makeTitle(q,m.point), question:q,
    answer:ans||'答案与解析待补充，可在入库后编辑完善。',
    reasons:[detectReason(text)], difficulty:'中', source:fileName, confidence, demo:false, include:true, fileName, fromUpload:true,
    ocrEngine:ocrInfo?(ocrInfo.engine||'apple-vision'):'', quality:quality?quality.label:'', ocrMs:ocrInfo?ocrInfo.ms:0
  };
}
function demoResult(fileItem,hint){
  const file=typeof fileItem==='string'?null:fileItem;
  const fileName=typeof fileItem==='string'?fileItem:(fileItem&&fileItem.name)||'资料';
  let subject=hint||guessSubjectFromName(fileName)||'数学';
  if(!curric()[subject]) subject='数学';
  const pool=SEED_ITEMS.filter(i=>i.subject===subject);
  const t=pool[hashStr(fileName)%pool.length]||SEED_ITEMS[0];
  const meta=(file&&file.meta)||{};
  const useCrop=!!(meta.cropUrl&&upload&&upload.autoCrop!==false);
  return {
    subject, chapter:t.chapter, point:t.point, title:t.title, question:t.question, answer:t.answer,
    reasons:[t.reason], difficulty:t.difficulty, source:fileName, confidence:88+Math.round(Math.random()*7),
    demo:true, include:true, fileName, fromUpload:true,
    preview: useCrop?meta.cropUrl:(meta.originalUrl||''),
    cropped: useCrop, blurry: !!meta.blurry, width:meta.width||0, height:meta.height||0,
    sharpness: meta.sharpness||0, kind:(file&&/pdf$/i.test(file.name||'')?'PDF':'图片')
  };
}

/* -------- duplicate detection -------- */
const DUP_THRESHOLD=0.72;
function normalizeQuestion(text){
  return String(text||'')
    .toLowerCase()
    .replace(/[\s\u3000]+/g,'')
    .replace(/[，。！？；：、“”‘’（）【】《》,.!?;:'"()\[\]<>·…—\-]/g,'');
}
function bigramSet(str){
  const t=String(str||''), set=new Set();
  if(t.length<2){ if(t) set.add(t); return set; }
  for(let i=0;i<t.length-1;i++) set.add(t.slice(i,i+2));
  return set;
}
function questionSimilarity(a,b){
  const A=bigramSet(normalizeQuestion(a)), B=bigramSet(normalizeQuestion(b));
  if(!A.size||!B.size) return 0;
  let inter=0;
  A.forEach(x=>{ if(B.has(x)) inter++; });
  return inter/Math.min(A.size,B.size);
}
function findDuplicate(r,pool){
  let best=null;
  (pool||[]).forEach(it=>{
    if(!it||!it.question) return;
    const score=questionSimilarity(r.question,it.question);
    if(score>=DUP_THRESHOLD&&(!best||score>best.score)) best={item:it,score};
  });
  return best;
}
function detectDuplicates(results){
  (results||[]).forEach((r,idx)=>{
    r.dup=null;
    for(let j=0;j<idx;j++){
      if(!results[j].question) continue;
      const score=questionSimilarity(r.question,results[j].question);
      if(score>=DUP_THRESHOLD){ r.dup={kind:'batch',idx:j,score:Math.round(score*100)}; break; }
    }
    if(!r.dup&&!r.demo){
      const hit=findDuplicate(r,state.items);
      if(hit) r.dup={kind:'history',id:hit.item.id,title:hit.item.title,score:Math.round(hit.score*100)};
    }
    r.dupAction=r.dup?'merge':'new';
  });
}
function dupBannerHTML(r,i){
  if(!r.dup) return '';
  const label=r.dup.kind==='history'
    ? `知识库已有「${esc(r.dup.title||'同类错题')}」`
    : `与本次上传的第 ${r.dup.idx+1} 道题内容接近`;
  return `<div class="dup-banner">
    <span class="dup-ic">${icon('doc',13)}</span>
    <span class="dup-copy"><b>疑似重复 · 相似度 ${r.dup.score}%</b><span>${label}，默认合并，保留原题并补充附件与错因。</span></span>
    <span class="dup-actions">
      <button type="button" data-dup="${i}" data-val="merge" class="${r.dupAction==='merge'?'on':''}">合并</button>
      <button type="button" data-dup="${i}" data-val="new" class="${r.dupAction==='new'?'on':''}">仍然新建</button>
    </span>
  </div>`;
}

function mergeResultInto(it,r,att){
  it.reasons=[...new Set([...(it.reasons||[]),...(r.reasons||[])].filter(Boolean))];
  it.reason=it.reasons.join('、')||'待补充';
  it.tags=[...new Set([...(it.tags||[]),...(r.reasons||[])].filter(Boolean))];
  if(r.answer&&!/^答案与解析待补充/.test(r.answer)&&(!it.answer||it.answer.length<r.answer.length)) it.answer=r.answer;
  if(att && !(it.attachments||[]).some(a=>a&&a.id===att.id)) it.attachments=[...(it.attachments||[]),att];
  if(r.source&&r.source!==it.source&&!(it.source||'').includes(r.source)){
    it.source=it.source?`${it.source} / ${r.source}`:r.source;
  }
  it.mergeCount=(it.mergeCount||1)+1;
  it.updatedAt=nowISO();
}

async function confirmUpload(){
  if(!upload) return;
  const inc=upload.results.filter(r=>r.include&&r.question.trim());
  if(!inc.length){ toast('请至少保留一道错题',false); return; }
  const btn=document.querySelector('#uploadModal [data-act="confirmUpload"]');
  if(btn){ btn.disabled=true; btn.innerHTML='正在保存原图…'; }
  const indexMap={};
  const attMap={};
  const fileAttCache=new Map();
  let added=0, merged=0;
  for(const r of inc){
    if(!(r.preview||r._file)) continue;
    let att=null;
    if(r._file && fileAttCache.has(r._file)){
      att=fileAttCache.get(r._file);
    }else{
      att=await persistAttachment(r);
      if(att&&r._file) fileAttCache.set(r._file,att);
    }
    if(att) attMap[upload.results.indexOf(r)]=att;
  }
  upload.results.forEach((r,idx)=>{
    if(!r.include||!r.question.trim()) return;
    let target=null;
    if(r.dup&&r.dupAction==='merge'){
      if(r.dup.kind==='history') target=state.items.find(x=>x.id===r.dup.id)||null;
      else if(r.dup.kind==='batch') target=indexMap[r.dup.idx]||null;
    }
    if(target){
      mergeResultInto(target,r,attMap[idx]);
      indexMap[idx]=target;
      merged++;
      return;
    }
    const it={
      id:uid(), subject:r.subject, chapter:r.chapter, point:r.point, title:r.title||makeTitle(r.question,r.point),
      question:r.question, answer:r.answer, reasons:[...(r.reasons||[])].filter(Boolean), reason:(r.reasons||[]).join('、')||'待补充',
      difficulty:r.difficulty, date:todayStr(), createdAt:nowISO(), updatedAt:nowISO(), source:r.source, mastery:0, starred:false,
      tags:(r.reasons||[]).filter(Boolean), reviewCount:0, lastReview:null, mergeCount:1,
      files:[], attachments:attMap[idx]?[attMap[idx]]:[]
    };
    state.items.push(it);
    indexMap[idx]=it;
    added++;
    const k=it.subject+'|'+it.chapter+'|'+it.point;
    if(!state.notes[k]) state.notes[k]=`【考查核心】${it.point}\n【常见失分】${it.reason}\n【复习建议】先回顾教材中的定义与例题，再重做本题；24 小时后用同类变式自测，确认能否独立完成。`;
  });
  if(!added&&!merged){ toast('没有可入库的错题',false); return; }
  save();
  const subs=[...new Set(inc.map(r=>r.subject).filter(Boolean))];
  ui.subject=subs.length===1?subs[0]:''; ui.chapter=''; ui.view='kb'; ui.filter='all'; ui.query='';
  upload.token++; closeUpload();
  renderAll();
  const rail=document.querySelector('.right'); if(rail) rail.scrollTop=0;
  const where=subs.length===1?`归入「${subs[0]}」知识库`:`已归入 ${subs.length} 个科目`;
  toast(`已入库：新增 ${added} 道${merged?`，合并 ${merged} 道`:''}，${where}`);
}

        </div>

            ? `<button class="btn soft" data-act="reviewMark" data-ok="0" style="border-color:#efd9d6;color:#a85550">仍需复习</button>
               <button class="btn primary" data-act="reviewMark" data-ok="1">${icon('check',14)}已掌握</button>`
            : `<button class="btn primary" style="width:100%" data-act="reviewReveal">${icon('target',14)}显示答案</button>`}

function markReview(ok){
  if(!reviewSession || reviewSession.idx>=reviewSession.items.length) return;
  const ref=reviewSession.items[reviewSession.idx];
  const it=state.items.find(x=>x.id===ref.id)||ref;
  const before=it.mastery||0;
  it.mastery=ok?Math.min(2,before+1):Math.max(0,before-1);
  it.lastReview=nowISO();
  it.reviewCount=(it.reviewCount||0)+1;
  it.updatedAt=nowISO();
  state.reviewLog=state.reviewLog||[];
  state.reviewLog.push({id:it.id,at:nowISO(),subject:it.subject,delta:(it.mastery||0)-before});
  save();
  reviewSession.done++;
  if(ok) reviewSession.correct++;
  reviewSession.idx++;
  reviewSession.revealed=false;
  renderReview();
  renderAll();
}

function closeReview(){
  hideOverlay('#reviewOverlay');
  reviewSession=null;
}

/* ---------------- export ---------------- */
function exportMarkdown(){
  let arr;
  if(ui.query.trim()){
    const q=ui.query.trim().toLowerCase();
    arr=state.items.filter(i=>[i.title,i.question,i.answer,i.subject,i.chapter,i.point,i.reason,(i.reasons||[]).join(' '),(i.tags||[]).join(' ')].join(' ').toLowerCase().includes(q));
  } else {
    arr=state.items.filter(i=>!ui.subject||i.subject===ui.subject).filter(i=>!ui.chapter||chapterMatch(i,ui.chapter));
    arr=filterItems(arr);
  }
  if(!arr.length){ toast('当前范围没有可导出的错题',false); return; }
  const scope=ui.query.trim()?`搜索「${ui.query.trim()}」`:(ui.subject?`${ui.subject}${ui.chapter?' · '+ui.chapter:''}`:'全部科目');
  const lines=[
    '# 九科错题知识库',
    '',
    `> 导出时间：${new Date().toLocaleString('zh-CN')}`,
    `> 导出范围：${scope}`,
    `> 共 ${arr.length} 道错题`,
    ''
  ];
  SUBJECTS.forEach(s=>{
    const sItems=arr.filter(i=>i.subject===s);
    if(!sItems.length) return;
    lines.push(`## ${s}`,'');
    const chapters=[...new Set(sItems.map(i=>itemChapterLabel(i)))];
    chapters.forEach(c=>{
      lines.push(`### ${c}`,'');
      const points=[...new Set(sItems.filter(i=>itemChapterLabel(i)===c).map(i=>i.point))];
      points.forEach(p=>{
        lines.push(`#### ${p}`,'');
        sItems.filter(i=>itemChapterLabel(i)===c&&i.point===p).forEach((it,idx)=>{
          const stateLabel=it.mastery>=2?'已掌握':it.mastery===1?'复习中':'待巩固';
          lines.push(`**${idx+1}. ${it.title}**`,'');
          lines.push(`- 题目：${it.question.replace(/\n/g,'\n  ')}`);
          lines.push(`- 答案 / 解析：${(it.answer||'待补充').replace(/\n/g,'\n  ')}`);
          lines.push(`- 错因：${it.reason||'待补充'}`);
          lines.push(`- 难度：${it.difficulty||'中'} · 掌握：${stateLabel}`);
          lines.push(`- 来源：${it.source||'未标注'}`);
          if(it.tags&&it.tags.length) lines.push(`- 标签：${it.tags.join('、')}`);
          lines.push('');
        });
      });
    });
  });
  lines.push('---','','由「九科图谱 · 高中错题知识库」导出');
  const md=lines.join('\n');
  const blob=new Blob(['\ufeff'+md],{type:'text/markdown;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`九科错题库-${todayStr()}.md`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1200);
  toast(`已导出 ${arr.length} 道错题`);
}

function downloadMarkdown(name,text){
  const blob=new Blob(['\ufeff'+text],{type:'text/markdown;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1200);
}

let picker=null, paperDoc=null;

function openPicker(preset){

function pickerFiltered(){
  let arr=state.items.slice();
  if(picker.subject) arr=arr.filter(i=>i.subject===picker.subject);
  if(picker.chapter) arr=arr.filter(i=>i.chapter===picker.chapter);
  if(picker.point) arr=arr.filter(i=>i.point===picker.point);
  if(picker.due) arr=arr.filter(isDue);
  if(picker.star) arr=arr.filter(i=>i.starred);
  if(picker.q){
    const q=picker.q.toLowerCase();
    arr=arr.filter(i=>[i.title,i.question,i.point,i.chapter,i.reason,i.source].join(' ').toLowerCase().includes(q));

      <div class="pp-title"><label>试卷标题</label><input class="input" id="paperTitle" value="${esc(picker.title||'错题重组卷')}" placeholder="错题重组卷"></div>

function batchPanelHTML(){

  return `<div class="batch-panel">
    <div class="bp-head">${icon('layers',13)} 批量修改所选 <span>${picker.ids.size} 道</span></div>
    <div class="bp-grid">
      <div class="f"><label>科目</label><select class="select" id="pbSubject"><option value="__keep" ${bs==='__keep'?'selected':''}>不修改科目</option>${SUBJECTS.map(s=>`<option value="${s}" ${bs===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="f"><label>教材章节</label><select class="select" id="pbChapter" ${hasSubj?'':'disabled'}>${hasSubj?chs.map(c=>`<option ${bc===c?'selected':''}>${esc(c)}</option>`).join(''):'<option>先选科目</option>'}</select></div>
      <div class="f"><label>知识点</label><select class="select" id="pbPoint" ${hasSubj?'':'disabled'}>${hasSubj?pts.map(p=>`<option ${bp===p?'selected':''}>${esc(p)}</option>`).join(''):'<option>先选章节</option>'}</select></div>

function bindPickerEvents(){
  const sub=$('#pkSubject');
  if(sub) sub.addEventListener('change',()=>{ picker.subject=sub.value; picker.chapter=''; picker.point=''; picker.bSubject=''; picker.bChapter=''; picker.bPoint=''; renderPicker(); });
  const ch=$('#pkChapter');
  if(ch) ch.addEventListener('change',()=>{ picker.chapter=ch.value; picker.point=''; renderPicker(); });
  const pt=$('#pkPoint');
  if(pt) pt.addEventListener('change',()=>{ picker.point=pt.value; renderPicker(); });
  const q=$('#pkQuery');
  if(q) q.addEventListener('input',()=>{ picker.q=q.value; renderPickList(); });
  const title=$('#paperTitle');
  if(title) title.addEventListener('input',()=>{ picker.title=title.value; });
  const ans=$('#paperAnsOpt');
  if(ans) ans.addEventListener('change',()=>{ picker.showAnswer=ans.checked; });
  const bs=$('#pbSubject');
  if(bs) bs.addEventListener('change',()=>{ picker.bSubject=bs.value; picker.bChapter=''; picker.bPoint=''; renderPicker(); });
  const bc=$('#pbChapter');
  if(bc) bc.addEventListener('change',()=>{ picker.bChapter=bc.value; picker.bPoint=''; renderPicker(); });
  const bp=$('#pbPoint');
  if(bp) bp.addEventListener('change',()=>{ picker.bPoint=bp.value; });
}

function togglePick(id){
  if(!picker) return;
  if(picker.ids.has(id)) picker.ids.delete(id); else picker.ids.add(id);
  const row=document.querySelector(`.pick-row[data-pick="${id}"]`);
  if(row){
    const on=picker.ids.has(id);
    row.classList.toggle('on',on);
    row.querySelector('.pk-check').innerHTML=on?icon('check',11):'';
  }
  renderPickList();
}

function pickAllFiltered(){
  pickerFiltered().forEach(i=>picker.ids.add(i.id));
  renderPicker();
  toast(`已选中当前 ${picker.ids.size} 道`);
}
function pickClear(){ picker.ids.clear(); renderPicker(); }

function batchApply(){
  const ids=[...picker.ids];
  if(!ids.length){ toast('请先勾选要修改的错题',false); return; }
  const bs=$('#pbSubject')?$('#pbSubject').value:'__keep';
  const bc=$('#pbChapter')&&!$('#pbChapter').disabled?$('#pbChapter').value:'';
  const bp=$('#pbPoint')&&!$('#pbPoint').disabled?$('#pbPoint').value:'';
  const reason=($('#pbReason')&&$('#pbReason').value||'').trim();
  const star=$('#pbStar')?$('#pbStar').value:'';
  if(bs!=='__keep'&&!bc){ toast('请选择章节',false); return; }
  if(reason) addCustomTag(reason);
  let n=0;
  ids.forEach(id=>{
    const it=state.items.find(x=>x.id===id); if(!it) return;
    if(bs!=='__keep'){
      it.subject=bs; it.chapter=bc; it.point=bp||((curric()[bs].chapters[bc]||[])[0]||'');
    }
    if(reason){
      it.reasons=[...new Set([...(it.reasons||[]),reason])];
      it.reason=it.reasons.join('、');
    }
    if(star==='1') it.starred=true;
    if(star==='0') it.starred=false;
    it.updatedAt=nowISO(); n++;
  });
  save(); renderAll(); renderPicker();
  toast(`已更新 ${n} 道错题`);
}

function batchDelete(){
  const ids=[...picker.ids];
  if(!ids.length){ toast('请先勾选要删除的错题',false); return; }
  if(!confirm(`确定删除选中的 ${ids.length} 道错题吗？${UNDO_MS/1000} 秒内可在提示条上撤销。`)) return;
  const snaps=ids.map(id=>{
    const it=state.items.find(x=>x.id===id);
    return it?JSON.parse(JSON.stringify(it)):null;
  }).filter(Boolean);
  const attIds=[];
  ids.forEach(id=>{
    const it=state.items.find(x=>x.id===id);
    (it&&it.attachments||[]).forEach(a=>{ if(a&&a.id) attIds.push(a.id); });
  });
  state.items=state.items.filter(i=>!picker.ids.has(i.id));
  picker.ids.clear();
  save(); renderAll(); renderPicker();
  scheduleRelease(attIds);
  toast(`已删除 ${ids.length} 道错题`, true, {label:'撤销', fn:()=>{
    let n=0;
    snaps.forEach(s=>{ if(!state.items.some(x=>x.id===s.id)){ state.items.push(s); n++; } });
    if(!n) return;
    save(); renderAll(); renderPicker();
    toast(`已恢复 ${n} 道错题`);
  }});
}

function generatePaper(){
  const its=[...picker.ids].map(id=>state.items.find(i=>i.id===id)).filter(Boolean);
  if(!its.length){ toast('请先勾选要组卷的错题',false); return; }
  const title=((($('#paperTitle')&&$('#paperTitle').value)||picker.title||'错题重组卷')).trim();
  paperDoc={items:its,title:title||'错题重组卷',showAnswer:!!picker.showAnswer,created:new Date()};
  closePicker(); renderPaper(); showOverlay('#paperOverlay');
}

function paperGroups(){
  const groups=[];
  const ordered=[...paperDoc.items].sort((a,b)=>{
    if(a.subject!==b.subject) return SUBJECTS.indexOf(a.subject)-SUBJECTS.indexOf(b.subject);
    const ac=Object.keys(curric()[a.subject].chapters), bc=Object.keys(curric()[b.subject].chapters);
    if(a.chapter!==b.chapter) return ac.indexOf(a.chapter)-bc.indexOf(b.chapter);
    return String(a.point).localeCompare(String(b.point),'zh');
  });
  ordered.forEach(it=>{
    let g=groups.find(x=>x.subject===it.subject&&x.chapter===it.chapter);
    if(!g){ g={subject:it.subject,chapter:it.chapter,items:[]}; groups.push(g); }
    g.items.push(it);
  });
  let no=0;
  groups.forEach(g=>{ g.entries=g.items.map(it=>({it,no:++no})); });
  return groups;
}

function paperSheetHTML(){
  const groups=paperGroups();
  const total=paperDoc.items.length;
  const d=paperDoc.created||new Date();
  const dateStr=`${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;
  const secs=groups.map(g=>{
    const col=subjColor(g.subject);
    return `<section class="paper-sec">
      <h3><span class="psec-dot" style="background:${col}"></span>${g.subject} · ${esc(editionChapterName(g.subject,g.chapter))}</h3>

          </div>
        </div>`).join('')}
    </section>`;
  }).join('');
  const ordered=[...groups.flatMap(g=>g.entries)].sort((a,b)=>a.no-b.no);
  const answers=paperDoc.showAnswer?`<section class="paper-answers">
    <h2>参考答案与解析</h2>
    ${ordered.map(({it,no:qno})=>`<div class="pa-item"><b>${qno}. ${esc(it.title)}</b><p>${esc(it.answer||'答案待补充').replace(/\n/g,'<br>')}</p><span>易错点：${esc(it.reason||'未标注')}</span></div>`).join('')}
  </section>`:'';
  return `<article class="paper-sheet">
    <header class="ps-head">
      <div class="ps-kicker">九科图谱 · 错题重组卷</div>
      <h1>${esc(paperDoc.title)}</h1>
      <div class="ps-meta">
        <span>姓名：<i></i></span><span>班级：<i></i></span><span>日期：${dateStr}</span>
        <span>共 ${total} 题 · ${groups.length} 个章节</span>
      </div>
      <div class="ps-note">说明：本卷由你的错题知识库自动汇编，按科目与教材章节排序。先独立完成，再对照答案与错因复盘。</div>
    </header>
    ${secs}
    ${answers}
    <footer class="ps-foot">九科图谱 · 高中错题知识库 · ${dateStr} 生成</footer>
  </article>`;
}

function renderPaper(){

function exportReport(){
  const d=reportData();
  const range=`${d.days[0].getFullYear()}/${d.days[0].getMonth()+1}/${d.days[0].getDate()} — ${d.days[6].getFullYear()}/${d.days[6].getMonth()+1}/${d.days[6].getDate()}`;
  const lines=[
    '# 本周学情周报',
    '',
    `> 统计范围：${range}（近 7 天）`,
    `> 生成时间：${new Date().toLocaleString('zh-CN')}`,
    '',
    '## 一、关键指标',
    '',
    `- 本周新增错题：${d.weekItems.length} 道`,
    `- 本周完成复习：${d.weekLogs.length} 次`,
    `- 整体掌握度：${d.pct}%`,
    `- 掌握度较本周初：${d.deltaPct>=0?'+':''}${d.deltaPct}%`,
    `- 本周学习天数：${d.activeDays}/7`,
    `- 今日待复习：${d.due.length} 道`,
    '',
    '## 二、九科错题分布',
    ''
  ];
  const dist=d.dist.filter(x=>x.n>0);
  if(dist.length) d.dist.forEach(x=>lines.push(`- ${x.subject}：${x.n} 道 · 掌握度 ${x.pct}%`));
  else lines.push('- 本周还没有新增错题，建议先上传一份周测或笔记。');
  lines.push('','## 三、错因构成','');
  const groups=Object.entries(d.reasons.groups).filter(([,n])=>n>0);
  if(groups.length) groups.forEach(([g,n])=>lines.push(`- ${g}：${n} 次`));
  else lines.push('- 暂无错因数据，可在入库时补充错因标签。');
  lines.push('','### 高频错因','');
  if(d.reasons.tags.length) d.reasons.tags.slice(0,8).forEach(([t,n])=>lines.push(`- ${t}：${n} 次`));
  else lines.push('- 暂无');
  lines.push('','## 四、优先补强知识点','');
  if(d.weak.length) d.weak.forEach((x,i)=>{
    const snap=state.items.filter(it=>it.subject===x.subject&&it.chapter===x.chapter&&it.point===x.point);
    lines.push(`${i+1}. **${x.point}**（${x.subject} · ${editionChapterName(x.subject,x.chapter)}）`);
    lines.push(`   - 错题 ${x.count} 道 · 掌握度 ${Math.round(x.avg/2*100)}%${x.due?` · ${x.due} 道待复习`:''}`);
    if(snap[0]) lines.push(`   - 代表题：${snap[0].title}`);
  });
  else lines.push('- 还没有足够的错题数据。');
  lines.push('','## 五、本周新增错题','');
  const weekSorted=[...d.weekItems].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(weekSorted.length) weekSorted.slice(0,30).forEach(it=>{
    lines.push(`- [${it.subject}] ${it.title}（${editionChapterName(it.subject,it.chapter)} · ${it.point}）`);
  });
  else lines.push('- 本周暂无新增。');
  lines.push('','## 六、下周行动建议','');
  if(d.due.length) lines.push(`- 先完成 ${d.due.length} 道待复习错题，优先安排掌握度较低的知识点。`);
  else lines.push('- 今日复习已完成，可挑一个薄弱知识点补充 2 道同类错题。');
  if(d.reasons.tags[0]) lines.push(`- 重点盯住「${d.reasons.tags[0][0]}」这一错因，做题时刻意检查对应步骤。`);
  const zero=d.dist.find(x=>x.n===0);
  if(zero) lines.push(`- ${zero.subject} 本周还没有新增错题，建议上传一份周测或课堂笔记。`);
  lines.push('- 每周固定一次 15 分钟复盘：先看周报，再按知识点复习，最后导出 Markdown 打印。');
  lines.push('','---','','由「九科图谱 · 高中错题知识库」自动生成');
  downloadMarkdown(`学情周报-${todayStr()}.md`, lines.join('\n'));
  toast('学情周报已导出');
}

}
function csvCell(v){ const t=String(v==null?'':v); return /[",\n\r]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; }
function downloadText(filename,text,mime){
  const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1500);
}

function parseCSV(text){
  const s=String(text||'').replace(/^\uFEFF/,'');
  const rows=[];
  let row=[], field='', q=false;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(q){
      if(c==='"'){ if(s[i+1]==='"'){ field+='"'; i++; } else q=false; }
      else field+=c;
    } else if(c==='"'){ q=true; }
    else if(c===','){ row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else if(c!=='\r'){ field+=c; }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()));
}
function importCatalogFile(file){
  if(file.size>4*1024*1024){ toast('文件超过 4MB，请拆分后再导入',false); return; }
  const reader=new FileReader();
  reader.onerror=()=>toast('文件读取失败',false);
  reader.onload=()=>{
    try{ importCatalogText(String(reader.result||'')); }
    catch(e){ toast('导入失败：'+(e.message||'格式无法识别'),false); }
  };
  reader.readAsText(file,'utf-8');
}
function importCatalogText(text){
  const rows=parseCSV(text);
  if(!rows.length) throw new Error('文件是空的');
  let start=0;
  if(/科目/.test(rows[0][0]||'')&&rows[0].some(x=>/章节/.test(x))) start=1;
  const bySubject={}, skipped=[];
  for(let i=start;i<rows.length;i++){
    const r=rows[i], line=i+1;
    const sub=String(r[0]||'').trim(), book=String(r[1]||'').trim();
    const chapter=String(r[2]||'').trim(), point=String(r[3]||'').trim();
    if(!sub&&!book&&!chapter&&!point) continue;
    if(!SUBJECTS.includes(sub)||!chapter){ skipped.push(line); continue; }
    const g=bySubject[sub]||(bySubject[sub]={books:catalogBooksDeep(sub),rows:0});
    let bk=g.books.find(b=>b.name===book)||null;
    let ch=null;
    for(const b of g.books){ const hit=b.chapters.find(c=>c.name===chapter); if(hit){ bk=b; ch=hit; break; } }
    if(!ch){
      if(!book||!point){ skipped.push(line); continue; }
      if(!bk){ bk={name:book,chapters:[]}; g.books.push(bk); }
      ch={name:chapter,points:[]};
      bk.chapters.push(ch);
    }
    if(point&&!ch.points.includes(point)) ch.points.push(point);
    g.rows++;
  }
  const subjects=Object.keys(bySubject);
  if(!subjects.length){
    catNote='没有识别到可导入的目录行。请确认表头为「科目,册次,章节,知识点」，且科目为九科之一。';
    catNoteWarn=true;
    renderVersion();
    toast('未导入任何目录',false);
    return;
  }
  let merged=0;
  subjects.forEach(sub=>{
    const g=bySubject[sub];
    g.books.forEach(b=>{ b.chapters=b.chapters.filter(c=>c.points.length); });
    rebuildImported(sub,g.books,'校本目录（导入）');
    merged+=g.rows;
  });
  subjects.forEach(sub=>retryLegacyItems(sub));
  rebuildCurriculum(); save();
  verSubject=subjects[0];
  catNote=`已导入 <b>${subjects.join('、')}</b>，合并 ${merged} 行目录数据${skipped.length?`；跳过 ${skipped.length} 行（第 ${skipped.slice(0,6).join('、')}${skipped.length>6?'…':''} 行）`:''}。重复章节与知识点已自动去重。`;
  catNoteWarn=!!skipped.length;
  renderVersion(); renderAll(); if(currentPoint) renderDrawer();
  toast(`目录已更新：${subjects.join('、')}`);
}
